[package]
name = "kerbside-proxy"
version = "0.1.0"
edition = "2021"
description = "Kerbside SPICE proxy: an inspection-first TLS relay between SPICE clients and hypervisors, authorised via the Kerbside gRPC control service."

[[bin]]
name = "kerbside-proxy"
path = "src/main.rs"

[dependencies]
# The ryll SPICE protocol crate provides the server-role handshake drivers, the
# SpiceClient connector, SpiceStream, constants, and the mini-header framing
# this proxy reuses. Pinned to ryll develop (contains the server primitives,
# the main/display message-type tables the L1 allowlist derives from, and the
# host-subject verifier that enforces ConnectionConfig.host_subject during the
# TLS handshake). Cargo resolves the workspace member by package name and
# builds only it plus its dependency subtree, not the ryll GUI binary.
shakenfist-spice-protocol = { git = "https://github.com/shakenfist/ryll", rev = "0f297a68d73115fac15e07f8c751ad6754a88810" }

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "signal", "sync"] }
tokio-rustls = "0.26"
# CancellationToken for the session-termination registry (session.rs):
# one token per session, shared by its channel relays, cancelled when the
# control plane sends TerminateSession.
tokio-util = "0.7"
# rustls is declared directly (feature "ring") so we can install the ring
# crypto provider at startup; the version matches what tokio-rustls 0.26 (and
# thus the ryll crate) resolves.
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"

# gRPC client for the KerbsideProxy control service over the UDS. tonic 0.14
# pairs with prost 0.14, and 0.14 split the prost codec out of the tonic crate
# itself: the generated stubs now name `tonic_prost::ProstCodec`, so
# tonic-prost is a runtime dependency and tonic-prost-build (below) is the
# code generator. All five crates -- tonic, tonic-prost, tonic-prost-build,
# prost and prost-build -- must move together across a major bump; see the
# tonic-prost-rust Renovate group in renovate.json.
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
# tonic has no `unix:` transport, so the UDS channel is built from a custom
# tower connector that dials a tokio UnixStream; hyper-util's TokioIo adapts
# the stream to hyper's IO traits. The Uri type the connector closure is
# handed comes from tonic's re-export (tonic::transport::Uri).
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# hyper 1.x has no built-in Server; the /metrics endpoint (metrics.rs) runs a
# manual accept loop + http1::Builder::new().serve_connection(...) over each
# accepted TcpStream, wrapped in hyper-util's TokioIo. Already present
# transitively via tonic, pinned here as a direct dependency with the
# features that code path needs.
hyper = { version = "1", features = ["server", "http1"] }
# Response bodies for the /metrics handler (a single in-memory buffer).
http-body-util = "0.1"
bytes = "1"

clap = { version = "4", features = ["derive"] }
# TCP keepalive on the accepted client socket (listen.rs), mirroring the
# backend leg's keepalive in the ryll SpiceClient. Version + "all" features
# match what the ryll shakenfist-spice-protocol crate uses.
socket2 = { version = "0.6", features = ["all"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Process metrics: a global registry + counters/gauges exposed over the
# /metrics endpoint (metrics.rs). The exposition format matches what the
# Python proxy's prometheus_client emits. Default features are off to keep
# the vulnerable `protobuf` transitive dependency (GHSA-2gh3-rmm4-6rq5) out
# of the tree: metrics.rs only uses the text exposition format via
# TextEncoder, never the ProtobufEncoder the default feature gates.
prometheus = { version = "0.14", default-features = false }

[dev-dependencies]
# `test-util` enables `#[tokio::test(start_paused = true)]`, used by the relay
# idle-read-timeout test to auto-advance the clock deterministically instead of
# waiting the real 15-minute backstop. Feature unification adds it for tests only.
tokio = { version = "1", features = ["test-util"] }
# The rpc.rs unit test serves an in-process tonic server over a UnixListener,
# which requires the server codegen (enabled in build.rs) and a stream adapter
# for the listener. tempfile provides a private directory for the test socket.
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tempfile = "3"
# The tls.rs unit test generates a self-signed cert/key pair to exercise
# load_acceptor end to end without a checked-in fixture.
rcgen = "0.14"

[build-dependencies]
# tonic-prost-build 0.14 matches tonic 0.14: from 0.14 the prost-flavoured
# code generator lives in its own crate (tonic-build itself now only carries
# the codec-agnostic machinery). protoc-bin-vendored ships a protoc binary so
# the build needs no system protoc package.
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
# sha2 computes the sha256 of kerbside.proto that build.rs embeds as the
# KERBSIDE_CONTRACT_HASH compile-time env (the daemon compares it against the
# Python side's generated kerbside/rpc/contract.py constant before launching
# this binary). Deliberately a build-dependency only: the hashing happens at
# compile time, so there is no reason to pull sha2 into the runtime dependency
# tree alongside ring/rustls.
sha2 = "0.10"
