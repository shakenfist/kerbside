name: Functional tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target:
        description: Select target
        type: choice
        options:
        - '["ovirt-45-rocky-8"]'
        - '["kolla-ansible-master-debian-12"]'
        default: '["kolla-ansible-master-debian-12"]'
        required: true
      retention:
        description: 'How long to retain the environment after the workflow run in minutes'
        required: true
        default: '0'
  merge_group:
  pull_request:
    branches:
      - develop

jobs:
  # Detect changes touching only review-tracking files or docs/ so
  # the heavy jobs can skip.
  # This replaces the old trigger-level paths-ignore, which cannot
  # coexist with required status checks: a required check in a
  # paths-ignore'd workflow never reports on a filtered PR, and a
  # required check that never reports blocks the merge forever. With a
  # filter job the workflow always reports, the heavy jobs skip on its
  # output, and a skipped required check counts as satisfied. On
  # workflow_dispatch the filter step is skipped and the output
  # defaults to code_changed=true so all selected tests run.
  #
  # Unlike the sibling smoke workflows, the filter here deliberately also runs
  # on merge_group: its output is consumed by the merge-tier jobs, so a
  # review-marks-only or docs-only queue entry skips two hours of cloud
  # deployment. dorny/paths-filter on a merge-group ref is production
  # behaviour, confirmed on this repo: in run 31754489835 (2026-08-13, the
  # queue entry for review-marks-only PR 304) "Check paths" succeeded on the
  # merge_group event, both cloud matrices skipped, and "Can merge" passed on
  # the skips.
  #
  # Keep the filter list in sync with its other copies: the
  # check_paths jobs in direct-qemu-functional.yml and
  # sf-e2e-functional.yml, the trigger-level paths-ignore in
  # codeql-analysis.yml, and the .vscode whitelist in .gitignore.
  check_paths:
    name: "Check paths"
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # On merge_group there is no PR payload, so make the
          # comparison base explicit rather than letting the action
          # infer one: develop is the queue's target branch, which by
          # definition does not yet contain the queued PRs' changes,
          # so a wrong code_changed=false -- the outcome that would
          # let "Can merge" go green on skips having tested nothing --
          # is structurally impossible; if develop advances mid-queue
          # the diff only grows, erring toward running the tier. On
          # pull_request events the action ignores base and compares
          # against the PR's base branch as before.
          base: develop
          # By default a file matches the filter if it matches ANY
          # listed pattern, which makes '**' match everything and
          # silently defeats the exclusions. 'every' requires a file
          # to match ALL patterns, which is the correct semantics for
          # an "everything except review marks and docs" filter.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!REVIEWS.md'
              - '!.vscode/*.weaudit'
              - '!.vscode/*.weaudit-shas.json'
              - '!.vscode/review-scope.toml'
              - '!docs/**'
      # Make the verdict visible in the log rather than inferred from
      # which downstream jobs skipped.
      - name: Report verdict
        run: echo "code_changed=${{ steps.filter.outputs.code || 'true (defaulted)' }}"

  sanity_checks:
    # Runs in both tiers: on pull_request as the core of the smoke
    # gate, and again in the merge group because it is minutes of m
    # runner and re-validates lint and units against the merged tree,
    # which no smoke run saw.
    needs: check_paths
    if: needs.check_paths.outputs.code_changed != 'false'
    # The bindep step below needs passwordless sudo for apt, which the
    # shared static pool does not grant, so this stays on an ephemeral vm
    # runner. m: light lint + unit tests + coverage.
    runs-on: [self-hosted, vm, debian-12, m]
    env:
      PIP_INDEX_URL: http://192.168.1.15:3141/root/pypi/+simple/
      # Fall back to pypi so a devpi cold-cache miss (empty index on a
      # first-touch package) cannot hard-fail the job.
      PIP_EXTRA_INDEX_URL: https://pypi.org/simple/
      PIP_TRUSTED_HOST: 192.168.1.15
    # On every event except merge_group, github.ref identifies the thing
    # being tested and is the right concurrency key. On merge_group it is
    # the per-attempt queue branch, gh-readonly-queue/develop/pr-NNN-SHA,
    # and GitHub mints a fresh SHA every time it rebuilds the group --
    # which it does on each push to develop. Keying on it therefore puts
    # every rebuild in a group of its own, so cancel-in-progress never
    # matches and superseded runs are never cancelled: they run to
    # completion, building whole clouds against sfcbr, starving the one
    # group that can actually merge. #279 had three of these overlapping.
    #
    # Cancelling them is safe here because the develop ruleset sets
    # max_entries_to_build: 1, so the queue only ever builds one entry at
    # a time and any other in-flight merge_group run is by definition
    # superseded -- GitHub has already abandoned its queue branch. Key
    # those runs on the base branch so they share one group. The
    # merge_group- prefix keeps them from colliding with a
    # workflow_dispatch run on develop, whose github.ref is the same
    # branch.
    concurrency:
      group: >-
        ${{ github.workflow }}-lint-${{
        github.event_name == 'merge_group'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code with two commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A required check whose ruleset context matches no workflow job
      # name never reports and blocks every merge; catch that here
      # rather than when merges stop working.
      - name: Verify required-check names against the exported ruleset
        run: tools/check-required-checks.sh

      - name: Install additional dependencies not tracked by pip
        timeout-minutes: 5
        run: |
          sudo apt-get install -y python3-venv
          python3 -mvenv /tmp/bindep-venv
          /tmp/bindep-venv/bin/pip3 install bindep
          echo
          /tmp/bindep-venv/bin/bindep || true
          echo
          sudo apt-get install -y $(/tmp/bindep-venv/bin/bindep --brief || true)

      - name: Upgrade base test tools
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-test
          . /tmp/venv-test/bin/activate
          pip3 install uv
          uv pip install tox tox-uv

      - name: Lint with flake8
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          tox -eflake8

      - name: Attempt to install requirements
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-reqs
          . /tmp/venv-reqs/bin/activate
          pip3 install uv
          uv pip install -r pyproject.toml

      - name: Run python3 unit tests
        timeout-minutes: 10
        run: |
          . /tmp/venv-test/bin/activate
          tox -epy3

      # The unit tests cannot cover this. .stestr.conf sets top_dir=./, so
      # importlib.resources resolves 'kerbside' to the checkout rather than
      # to anything installed, leaving the suite blind to files being
      # dropped from the built artifact. That is the exact shape of the
      # defect this phase fixed: the migration tree sat outside the package
      # for a long time, so every developer saw a working `alembic upgrade
      # head` from a checkout while no wheel contained the migrations.
      - name: Verify the wheel contains its runtime files
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          uv pip install build
          python3 tools/check-wheel.py

      - name: List failing tests
        if: failure()
        id: failures
        run: |
          echo "Gathering list of failed tests..."
          touch /srv/ci/failed
          . /tmp/venv-test/bin/activate
          tox -efailing || true > /srv/ci/failed
          echo

          failed=$(grep -E "^FAIL: " /srv/ci/failed | \
              sed -z 's/FAIL: shakenfist_ci\.//g;s/\n/, /g;s/, $/\n/') \
              || true

          echo "Failed tests:"
          cat /srv/ci/failed
          echo

          echo "failures<<EOF" >> ${GITHUB_OUTPUT}
          echo "${failed}" >> ${GITHUB_OUTPUT}
          echo "EOF" >> ${GITHUB_OUTPUT}
          echo "GITHUB_OUTPUT is:"
          cat ${GITHUB_OUTPUT}

      - name: Generate coverage report
        timeout-minutes: 10
        run: |
          . /tmp/venv-test/bin/activate
          tox -ecover
          zip -r cover.zip cover

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          retention-days: 90
          if-no-files-found: error
          path: cover.zip

  ovirt_matrix:
    # Merge tier: runs in the merge queue and on
    # workflow_dispatch, never on pull_request. On a workflow_dispatch
    # run, skip this job cleanly (neutral) when its target was not
    # selected, rather than running a step that calls core.setFailed --
    # which reported an unselected target as red and then left the
    # always() artifact steps to time out against a guest that was
    # never provisioned. The target name is a literal because the
    # matrix context is not available in a job-level if:; it mirrors
    # the single matrix entry below ('ovirt-45-rocky-8').
    if: >-
      (github.event_name == 'merge_group'
       || (github.event_name == 'workflow_dispatch'
           && contains(inputs.target, 'ovirt-45-rocky-8')))
      && needs.check_paths.outputs.code_changed != 'false'
    name: "${{ matrix.test.description }}"
    strategy:
      fail-fast: false
      matrix:
        test: [
          {
            'name': 'ovirt-45-rocky-8',
            'description': 'oVirt 4.5 on Rocky 8',
            'environment_name': 'ovirt',
            'ovirt_rpm': 'centos-release-ovirt45',
            'base': 'rocky:8',
            'baseuser': 'cloud-user',
            'hostname': 'ovirt',
            'ovirt_username': 'admin@ovirt@internalsso'
          },
        ]
    # l: this job now also builds the Rust proxy wheel, builds ryll from
    # source, and runs MariaDB plus kerbside on the runner itself, which
    # is heavier than the environment-provisioning work the m runner was
    # sized for.
    runs-on: [self-hosted, vm, debian-12, l]
    needs: [sanity_checks, check_paths]
    timeout-minutes: 120
    # The runner image exports http_proxy/https_proxy pointing at an
    # upstream squid cache for apt, github, and the cargo registry.
    # Loopback traffic to kerbside on 127.0.0.1 must bypass that proxy
    # or squid returns 503 ERR_CONNECT_FAIL when it cannot route the
    # request back through itself. The oVirt engine must bypass it too:
    # kerbside's oVirt source reaches the engine with python requests
    # (unlike the ssh/scp steps, which ignore http_proxy entirely), and
    # the engine lives on the private test network the squid cannot
    # route to.
    env:
      no_proxy: 127.0.0.1,localhost,ovirt.local,10.0.2.2
      # The single source of truth for the runner-side kerbside deploy
      # location. deploy-kerbside.sh and drive-console.py honour the
      # WORKDIR environment variable (it is their documented default),
      # but WORKDIR is too generic a name to export into every step of
      # this job -- several steps run scripts from the shakenfist/actions
      # checkout, which could grow a WORKDIR consumer of its own -- so
      # the lane-specific name is set here and mapped to WORKDIR only on
      # the deploy and drive steps. The artifact step references it
      # directly, so changing it here changes all of them together.
      OVIRT_LANE_WORKDIR: /tmp/kerbside-ovirt-ci
    # See sanity_checks above for why merge_group is keyed on the base
    # branch rather than github.ref. This job is the one that made it
    # matter: it builds a full nested oVirt cloud, so a superseded run
    # left alive here is two hours of sfcbr capacity spent on a merge
    # group that can no longer merge.
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ matrix.test.name }}-${{
        github.event_name == 'merge_group'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Set environment variables
        shell: bash
        run: |
          echo "SF_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> $GITHUB_ENV
          echo "SHAKENFIST_NAMESPACE=$(hostname)" >> $GITHUB_ENV

      - name: Checkout the actions repository
        uses: actions/checkout@v7
        with:
          repository: shakenfist/actions
          path: actions
          fetch-depth: 0

      - name: Checkout kerbside
        uses: actions/checkout@v7
        with:
          path: kerbside
          fetch-depth: 0

      # The under-cloud playbooks create their test instances with the
      # shakenfist.shakenfist collection's native sf_* modules (the client's
      # ansible shims they previously used were retired), so the collection
      # must be resolvable on this runner. It is built from a shakenfist
      # repository checkout.
      - name: Checkout the shakenfist repository
        uses: actions/checkout@v7
        with:
          repository: shakenfist/shakenfist
          path: shakenfist
          fetch-depth: 1

      - name: Build infrastructure
        shell: bash
        run: |
          . $GITHUB_ENV

          ${GITHUB_WORKSPACE}/actions/tools/install-collection.sh \
              ${GITHUB_WORKSPACE}/shakenfist

          ansible-playbook -i /home/debian/ansible-hosts \
              --extra-vars "identifier=${SHAKENFIST_NAMESPACE} base=${{ matrix.test.base }} base_user=${{ matrix.test.baseuser }} environment_name=${{ matrix.test.environment_name }} hostname=${{ matrix.test.hostname }}" \
              --tags all ${GITHUB_WORKSPACE}/actions/ansible/kerbside-single-node.yml

      - name: Prepare /srv on target
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "sudo chown ${{ matrix.test.baseuser }}:${{ matrix.test.baseuser }} /srv"

      - name: Render oVirt answers file
        run: |
          sed 's|{{ ovirt_fqdn }}|ovirt.local|g' \
              ${GITHUB_WORKSPACE}/actions/etc/${{ matrix.test.name }}-answers.conf.j2 \
              > /tmp/${{ matrix.test.name }}-answers.conf

      - name: Copy tools and config to target
        run: |
          . $GITHUB_ENV

          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/actions/tools/ovirt-*.sh \
              ${GITHUB_WORKSPACE}/actions/tools/start-test-target.py \
              ${GITHUB_WORKSPACE}/kerbside/tools/test-ovirt-console.py \
              ${GITHUB_WORKSPACE}/kerbside/tools/dump-ovirt-host-subject.py \
              ${GITHUB_WORKSPACE}/kerbside/tools/create-ovirt-vnc-vm.py \
              /tmp/${{ matrix.test.name }}-answers.conf \
              ${GITHUB_WORKSPACE}/actions/etc/${{ matrix.test.name }}-repos.patch \
              ${{ matrix.test.baseuser }}@10.0.2.2:/srv/

      - name: Install base packages
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "bash /srv/ovirt-install-base.sh"

      - name: Install upstream oVirt release package
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; sudo dnf install -y ${{ matrix.test.ovirt_rpm }}"

      - name: Apply repos patch
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; cd /etc/yum.repos.d; sudo patch -p1 < /srv/${{ matrix.test.name }}-repos.patch"

      - name: Enable Rocky 8 dnf modules for oVirt
        if: matrix.test.base == 'rocky:8'
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; sudo dnf module -y enable javapackages-tools postgresql:12 mod_auth_openidc:2.3 nodejs:14 pki-deps"

      - name: Further package configuration
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; sudo dnf update -y; sudo dnf distro-sync --nobest -y"

      - name: Install ovirt-engine
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; sudo dnf install -y ovirt-engine"

      - name: Setup ovirt-engine
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; sudo engine-setup --config-append=/srv/${{ matrix.test.name }}-answers.conf"

      - name: Patch oVirt host-deploy OVN Ansible role
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "bash /srv/ovirt-patch-ovn.sh"

      - name: Prepare host for oVirt hypervisor
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "bash /srv/ovirt-prepare-host.sh"

      - name: Copy desktop disk image to target
        if: matrix.test.environment_name == 'ovirt'
        run: |
          . $GITHUB_ENV

          # Use the pre-cached desktop image (with qemu-guest-agent and
          # spice-vdagent pre-installed) from the CI runner
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              /srv/ci/cached/debian-12-gnome-agents \
              ${{ matrix.test.baseuser }}@10.0.2.2:/srv/debian-12-gnome-agents.qcow2

      - name: Create SPICE test target VM
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "python3 /srv/start-test-target.py \
                  --url https://${{ matrix.test.hostname }}.local/ovirt-engine/api \
                  --username ${{ matrix.test.ovirt_username }} \
                  --password foobar \
                  --ca-file /etc/pki/ovirt-engine/ca.pem \
                  --datacenter test \
                  --cluster test \
                  --storage-domain local-storage \
                  --host-address ${{ matrix.test.hostname }}.local \
                  --host-password foobar \
                  --storage-path /srv/ovirt-storage \
                  --disk-image /srv/debian-12-gnome-agents.qcow2"

      - name: Create a second VM with no SPICE console
        # kerbside's oVirt source must skip a VM it cannot broker and
        # carry on scraping. Before this VM existed, every VM in the
        # lane had a SPICE display, so the skip path never ran here --
        # and a missing `continue` in sources/ovirt.py errored the whole
        # source instead, dropping every VM after the offending one and
        # reaping their consoles as gone. drive-console.py asserts this
        # VM is absent from the console list while the SPICE one is
        # present, which fails in both directions.
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "python3 /srv/create-ovirt-vnc-vm.py \
                  --url https://${{ matrix.test.hostname }}.local/ovirt-engine/api \
                  --username ${{ matrix.test.ovirt_username }} \
                  --password foobar \
                  --ca-file /etc/pki/ovirt-engine/ca.pem \
                  --cluster test"

      - name: Test SPICE console connectivity
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "python3 /srv/test-ovirt-console.py \
                  --url https://${{ matrix.test.hostname }}.local/ovirt-engine/api \
                  --username ${{ matrix.test.ovirt_username }} \
                  --password foobar \
                  --ca-file /etc/pki/ovirt-engine/ca.pem"

      - name: Dump oVirt host certificate subjects (diagnostic)
        continue-on-error: true
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "python3 /srv/dump-ovirt-host-subject.py \
                  --url https://${{ matrix.test.hostname }}.local/ovirt-engine/api \
                  --username ${{ matrix.test.ovirt_username }} \
                  --password foobar \
                  --ca-file /etc/pki/ovirt-engine/ca.pem"

      - name: Resolve ovirt.local on the runner
        # kerbside's oVirt source talks to https://ovirt.local/ovirt-engine
        # and the engine's certificate is CN=ovirt.local, so an IP URL
        # fails verification. The backend SPICE leg needs no DNS -- the
        # engine reports the console address as an IP.
        #
        # A plain append is fine, and there is deliberately no teardown
        # of anything this job installs or starts on the runner (MariaDB,
        # the kerbside daemon, gunicorn, ryll): these vm-labelled runners
        # are single-use VMs discarded after the job -- that is also why
        # the retention step below can hold the environment open just by
        # sleeping -- so nothing accumulates across runs.
        run: echo '10.0.2.2 ovirt.local' | sudo tee -a /etc/hosts

      - name: Probe hypervisor SPICE ports from the runner
        # The existing console handshake check above runs ON the target,
        # so it proves nothing about the runner's own network path to the
        # hypervisor. This probe localises a firewall problem to one line
        # instead of it surfacing as an opaque TLS failure much later,
        # once kerbside is deployed and driving a real session.
        run: |
          for port in 5900 5901; do
            if ! timeout 5 bash -c "</dev/tcp/10.0.2.2/${port}" 2>/dev/null; then
              echo "The hypervisor SPICE ports are not reachable from" \
                  "the runner; check firewalld on the oVirt host" \
                  "(10.0.2.2:${port})." >&2
              exit 1
            fi
          done

      - name: Install Rust build prerequisites
        # build-essential and pkg-config are all the proxy wheel needs, but
        # this lane also builds ryll, and ryll needs more. Its audiopus_sys
        # dependency survives --no-default-features; pkg-config does not find
        # a system Opus on the runner, so the build script falls back to
        # compiling Opus itself via CMake and hard-fails without cmake on
        # PATH. The -dev packages come from direct-qemu-functional.yml, which
        # has been building ryll on this same runner image for a while:
        # --no-default-features drops the eframe/cpal runtime libraries, but
        # transitive build scripts still probe for the headers at compile
        # time. Keep this list in step with that workflow.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libasound2-dev libxcb1-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin and ziglang
        run: |
          python3 -m venv "${RUNNER_TEMP}/wheelvenv"
          "${RUNNER_TEMP}/wheelvenv/bin/pip" install --quiet --upgrade pip maturin ziglang
          echo "${RUNNER_TEMP}/wheelvenv/bin" >> "$GITHUB_PATH"

      - name: Build the PR's proxy wheel (manylinux, matches the PyPI artifact)
        # Reuse the release lane's build-proxy-wheel.sh so the CI wheel is the
        # same portable manylinux_2_28 artifact production pulls from PyPI --
        # correct across the runner (bookworm) -> trixie image glibc boundary,
        # unlike a host-native build.
        run: |
          WHEEL_OUT="${GITHUB_WORKSPACE}/kerbside/dist/proxy-wheels" \
              "${GITHUB_WORKSPACE}/kerbside/tools/build-proxy-wheel.sh" "$(uname -m)"

      - name: Build ryll from source
        # The visual-digest feature is only needed for the Uncalibrated
        # Sextant fixture; this lane drives a Debian GNOME guest, so the
        # plain headless client is enough and the build is cheaper. Uses
        # the Rust toolchain installed above.
        run: |
          git clone --depth 1 \
            https://github.com/shakenfist/ryll.git /tmp/ryll-src
          cd /tmp/ryll-src
          cargo build --release --no-default-features -p ryll
          sudo install -m 755 target/release/ryll /usr/local/bin/ryll
          ryll --version || true

      - name: Deploy kerbside on the runner
        timeout-minutes: 15
        env:
          WORKDIR: ${{ env.OVIRT_LANE_WORKDIR }}
        run: |
          # NOTE: no /api suffix here, unlike the target-side test-script
          # steps above -- kerbside's oVirt source appends /api itself, so
          # passing .../ovirt-engine/api would be wrong for sources.yaml.
          #
          # --proxy-wheel is double quoted, not single quoted: the glob has to
          # survive this call so the script expands it at the point of use,
          # but ${GITHUB_WORKSPACE} still has to expand here. Single quotes
          # suppress both and hand pip a literal dollar sign.
          ${GITHUB_WORKSPACE}/kerbside/tools/ovirt-e2e/deploy-kerbside.sh \
              --engine-url https://${{ matrix.test.hostname }}.local/ovirt-engine \
              --username ${{ matrix.test.ovirt_username }} \
              --password foobar \
              --kerbside-src ${GITHUB_WORKSPACE}/kerbside \
              --proxy-wheel "${GITHUB_WORKSPACE}/kerbside/dist/proxy-wheels/*.whl"

      - name: Drive a proxied SPICE console
        # This is the actual gate -- it relays a real SPICE session from
        # the oVirt hypervisor through kerbside's Rust proxy over TLS,
        # with the host certificate subject pinned.
        timeout-minutes: 10
        env:
          WORKDIR: ${{ env.OVIRT_LANE_WORKDIR }}
        run: |
          ${WORKDIR}/venv/bin/python3 \
              ${GITHUB_WORKSPACE}/kerbside/tools/ovirt-e2e/drive-console.py

      - name: Gather artifacts
        if: always()
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "bash /srv/ovirt-gather-artifacts.sh"

          mkdir -p /srv/github/artifacts/bundle/
          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2:/tmp/bundle.zip \
              /srv/github/artifacts/bundle/

          cd /srv/github/artifacts/bundle/
          unzip bundle.zip
          rm bundle.zip
          cd ..
          zip -r bundle.zip bundle

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-${{ matrix.test.name }}
          retention-days: 90
          if-no-files-found: error
          path: /srv/github/artifacts/bundle.zip

      # The kerbside-side artifacts, distinct from the target-side bundle
      # above: the daemon and gunicorn logs, ryll's stdio, the
      # smoke-client log, and kerbside.env. kerbside.env contains no
      # secrets beyond the well-known loopback MariaDB credential
      # hardcoded in deploy-kerbside.sh and
      # tools/direct-qemu/start-kerbside.sh; the engine password is
      # deliberately absent. Anyone adding a key to kerbside.env must
      # clear that same bar -- these artifacts are world-downloadable
      # for the full retention period. if-no-files-found is warn
      # rather than error -- a failure before the deploy step legitimately
      # leaves these absent. Deliberately excludes console.vv (carries a
      # live proxy token), the auth seed file (key material), and
      # sources.yaml (holds the oVirt source password, which is why
      # gen-sources.py writes it 0600); do not add them here. The daemon
      # log already reports which source it loaded and why it errored.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kerbside-ovirt-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            ${{ env.OVIRT_LANE_WORKDIR }}/kerbside.log
            ${{ env.OVIRT_LANE_WORKDIR }}/kerbside.log.gunicorn-access
            ${{ env.OVIRT_LANE_WORKDIR }}/kerbside.log.gunicorn-error
            ${{ env.OVIRT_LANE_WORKDIR }}/kerbside.env
            ${{ env.OVIRT_LANE_WORKDIR }}/ryll-ovirt.stdout
            ${{ env.OVIRT_LANE_WORKDIR }}/ryll-ovirt.stderr
            ${{ env.OVIRT_LANE_WORKDIR }}/smoke-client.log

      - name: Retain the environment if requested
        # !cancelled(), not the bare event check: without it a failing step
        # skips this one and the environment is torn down anyway, so the
        # retention input only ever worked on runs that had already
        # succeeded -- exactly the runs nobody needs to log into. Not
        # always(), because a run someone deliberately cancelled should
        # release its environment rather than sit here sleeping.
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: sleep $(( $MINUTES * 60 ))
        env:
          MINUTES: ${{ inputs.retention }}

  openstack_matrix:
    # Merge tier: runs in the merge queue and on
    # workflow_dispatch, never on pull_request. On a workflow_dispatch
    # run, skip this job cleanly (neutral) when its target was not
    # selected, rather than running a step that calls core.setFailed --
    # which reported an unselected target as red and then left the
    # always() artifact steps to time out against a guest that was
    # never provisioned. The target name is a literal because the
    # matrix context is not available in a job-level if:; it mirrors
    # the single matrix entry below ('kolla-ansible-master-debian-12').
    if: >-
      (github.event_name == 'merge_group'
       || (github.event_name == 'workflow_dispatch'
           && contains(inputs.target, 'kolla-ansible-master-debian-12')))
      && needs.check_paths.outputs.code_changed != 'false'
    name: "${{ matrix.test.description }}"
    strategy:
      fail-fast: false
      matrix:
        test: [
          {
            'name': 'kolla-ansible-master-debian-12',
            'environment_name': 'kolla',
            'description': 'OpenStack via Kolla-Ansible master on Debian 12',
            'openstack_release': 'master',
            'base': 'debian:12',
            'baseuser': 'debian'
          },
        ]
    runs-on: [self-hosted, vm, debian-12, m]
    needs: [sanity_checks, check_paths]
    timeout-minutes: 120
    # See sanity_checks above for why merge_group is keyed on the base
    # branch rather than github.ref.
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ matrix.test.name }}-${{
        github.event_name == 'merge_group'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Setup test environment
        uses: shakenfist/actions/setup-kerbside-environment@main
        with:
          base: ${{ matrix.test.base }}
          base_user: ${{ matrix.test.baseuser }}
          openstack_release: ${{ matrix.test.openstack_release }}
          topology: all-in-one

      - name: Checkout kerbside (for tempest plugin sources)
        uses: actions/checkout@v7
        with:
          path: kerbside
          fetch-depth: 0

      - name: Build patched repositories
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches; ./_build/assemble-source.sh --no-tarball ${{ matrix.test.openstack_release }}'

      - name: Inject PR's kerbside checkout into the build tree
        # assemble-source.sh clones kerbside's default branch, so without
        # this step the deployed container would have develop's code, not
        # the PR's. Replace the clone with the PR checkout so the kerbside
        # we build, deploy, and run Tempest against is what this PR ships.
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'sudo rm -rf /srv/shakenfist/kerbside-patches/src/kerbside'

          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/kerbside \
              ${{ matrix.test.baseuser }}@10.0.2.2:/srv/shakenfist/kerbside-patches/src/kerbside

      # The kerbside-proxy Kolla container runs "kerbside daemon run", which
      # supervises the compiled kerbside-proxy binary. That binary ships in the
      # wheel (bindings="bin", binary on PATH); production images
      # install it from PyPI. To exercise THIS PR's proxy instead, build the
      # wheel from the PR source and stage it into the image's build tree, so
      # the kerbside-base Dockerfile installs it in preference to the released
      # one (see the proxy-wheels conditional in kerbside-patches). The runner
      # carries no Rust toolchain by default; the next four steps provision one
      # and build the wheel, mirroring the release lane that builds the PyPI
      # artifact (.github/workflows/release.yml build-proxy-wheels).
      - name: Install proxy-wheel build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin and ziglang
        run: |
          python3 -m venv "${RUNNER_TEMP}/wheelvenv"
          "${RUNNER_TEMP}/wheelvenv/bin/pip" install --quiet --upgrade pip maturin ziglang
          echo "${RUNNER_TEMP}/wheelvenv/bin" >> "$GITHUB_PATH"

      - name: Build the PR's proxy wheel (manylinux, matches the PyPI artifact)
        # Reuse the release lane's build-proxy-wheel.sh so the CI wheel is the
        # same portable manylinux_2_28 artifact production pulls from PyPI --
        # correct across the runner (bookworm) -> trixie image glibc boundary,
        # unlike a host-native build.
        run: |
          WHEEL_OUT="${GITHUB_WORKSPACE}/kerbside/dist/proxy-wheels" \
              "${GITHUB_WORKSPACE}/kerbside/tools/build-proxy-wheel.sh" "$(uname -m)"

      - name: Stage the proxy wheel onto the Kolla build node
        run: |
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'mkdir -p /srv/shakenfist/kerbside-patches/src/kerbside/proxy-wheels'

          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/kerbside/dist/proxy-wheels/*.whl \
              ${{ matrix.test.baseuser }}@10.0.2.2:/srv/shakenfist/kerbside-patches/src/kerbside/proxy-wheels/

      - name: Bootstrap Kolla-Ansible
        run: |
          . $GITHUB_ENV

          script="cd /srv/shakenfist/kerbside-patches;"
          script="${script} sudo ./tools/bootstrap-kolla-ansible"
          script="${script} --image-tag ${{ matrix.test.openstack_release }}-debian-trixie-local"
          script="${script} --build-targets ${{ matrix.test.openstack_release }}"
          script="${script} --topology all-in-one;"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 "${script}"

      - name: Apply kerbside CI globals overlay
        # bootstrap-kolla-ansible has just written
        # /etc/kolla/globals.yml from kerbside-patches' globals-master.yml.
        # Append this repo's overlay to disable Kolla-Ansible features
        # we do not need to test kerbside end to end -- kolla-ansible
        # reads globals.yml top-to-bottom so trailing keys win.
        run: |
          . $GITHUB_ENV
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/kerbside/etc/kolla-ci-globals-overlay.yml \
              ${{ matrix.test.baseuser }}@10.0.2.2:/tmp/kolla-ci-globals-overlay.yml

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'sudo bash -c "echo >> /etc/kolla/globals.yml && cat /tmp/kolla-ci-globals-overlay.yml >> /etc/kolla/globals.yml"'

      - name: Build container images
        # The build-images value is forwarded to kolla-build as a regex.
        # Restrict it to the services kerbside actually exercises end to
        # end -- kerbside itself, the OpenStack core needed to boot a
        # SPICE-enabled instance (nova, neutron, glance, keystone,
        # placement), and the infrastructure those depend on (haproxy,
        # keepalived, mariadb, rabbitmq, memcached, plus the
        # base/openstack-base/kolla-toolbox foundations). 'all' builds
        # 200+ images and is what kerbside-patches CI uses to catch
        # upstream regressions; we trade that breadth here for ~10
        # minutes off the build, with the cost that adding a new
        # kolla-side dependency to kerbside will require updating this
        # regex.
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches; ./_build/build-containers.sh --build-targets ${{ matrix.test.openstack_release }} --build-images "^(base|openstack-base|kolla-toolbox|cron|haproxy|httpd|keepalived|mariadb|memcached|openvswitch|proxysql|rabbitmq|keystone|glance|placement|neutron|nova|kerbside)" --distro debian --distro-version trixie --image-tag local'

      - name: Deploy Kolla-Ansible
        uses: shakenfist/actions/deploy-kolla-ansible@main
        with:
          base_user: ${{ matrix.test.baseuser }}
          image_tag: ${{ matrix.test.openstack_release }}-debian-trixie-local
          build_targets: ${{ matrix.test.openstack_release }}
          topology: all-in-one
          skip_bootstrap: 'true'

      - name: Test SPICE console connectivity
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches; sudo bash -c ". /etc/kolla/admin-openrc.sh && ./tools/test-console"'

      - name: Run Kerbside Tempest tests
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches/src/kerbside; sudo bash ./tools/run-tempest-tests'

      - name: Collect logs
        if: always()
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches; sudo ./tools/gather-logs'
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'if [ -d /srv/kerbside-tempest ]; then sudo zip -r /tmp/bundle.zip /srv/kerbside-tempest/logs /srv/kerbside-tempest/tempest/etc/tempest.conf 2>/dev/null || true; fi'
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2:/tmp/bundle.zip /tmp/bundle.zip

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-${{ matrix.test.name }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/bundle.zip

      - name: Retain the environment if requested
        # See the matching step in ovirt_matrix: without !cancelled() a
        # failing step skips this one, so retention only held environments
        # open for runs that had already passed.
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: sleep $(( $MINUTES * 60 ))
        env:
          MINUTES: ${{ inputs.retention }}

  automated_reviewer:
    name: "Automated reviewer"
    # The needs: list is the "review only once CI has passed" gate: a job
    # skipped because a dependency failed never starts the reusable workflow.
    # That means the smoke tier only -- the cloud matrices run in the merge
    # queue, after review, so the review posts in minutes rather than after the
    # slowest cloud lane. Everything else about the reviewer -- runner,
    # timeout, fork restriction, bot-commit check -- lives in the shared
    # workflow so it stays in step with the rest of the fleet. The event gate
    # below is technically redundant with the shared workflow's internal
    # pull_request guard, but keeping it local means this repo's tier
    # membership does not depend on a guard in another repository, and
    # merge-group and dispatch rollups stay free of a no-op reviewer job.
    if: github.event_name == 'pull_request'
    needs: [sanity_checks]
    # A cross-repository reusable workflow cannot grant itself more
    # token scope than its caller has, so the permissions go here.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main
    secrets: inherit

  # The merge-queue gate jobs, mirroring shakenfist/shakenfist. Their
  # display names ("Can see status", "Can enqueue", "Can merge") are
  # the required status checks in the develop ruleset. The jq below
  # treats a skipped need as satisfied, which is what lets
  # check_paths-driven skips (and the cross-tier skip of the other
  # gate) pass a required check. The flip side: a failed dependency
  # manifests in its dependents as 'skipped', which would read as
  # green -- so each gate must directly need every job whose failure
  # should block it, not rely on transitive needs. The
  # "permissions: actions: read" on the two jq gates mirrors the
  # shakenfist/shakenfist template byte-for-byte and is not
  # load-bearing (the jq reads only the needs context); the per-lane
  # gates in the smoke workflows deliberately omit it.
  can_see_status:
    name: "Can see status"
    runs-on: [self-hosted, static]
    # Runs "true", so five minutes is generous even on a busy runner.
    timeout-minutes: 5
    steps:
      - name: "Immediate success"
        run: true

  can_enqueue:
    name: "Can enqueue"
    needs:
      - check_paths
      - sanity_checks
    if: always() && github.event_name != 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    # A jq expression over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"

  can_merge:
    name: "Can merge"
    needs:
      - check_paths
      - sanity_checks
      - ovirt_matrix
      - openstack_matrix
    if: always() && github.event_name == 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    # A jq expression over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"
