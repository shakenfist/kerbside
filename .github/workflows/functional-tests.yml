name: Test cloud compatibility

on:
  workflow_dispatch:
    inputs:
      target:
        description: Select target
        type: choice
        options:
        - '["ovirt-45-rocky-8"]'
        - '["kolla-ansible-master-debian-12"]'
        default: '["kolla-ansible-master-debian-12"]'
        required: true
      retention:
        description: 'How long to retain the environment after the workflow run in minutes'
        required: true
        default: '0'
  pull_request:
    branches:
      - develop

jobs:
  sanity_checks:
    runs-on: [self-hosted, vm, debian-12]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true

    steps:
      - name: Checkout code with two commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install additional dependencies not tracked by pip
        timeout-minutes: 5
        run: |
          sudo apt-get install -y python3-venv
          python3 -mvenv /tmp/bindep-venv
          /tmp/bindep-venv/bin/pip3 install bindep
          echo
          /tmp/bindep-venv/bin/bindep || true
          echo
          sudo apt-get install -y $(/tmp/bindep-venv/bin/bindep --brief || true)

      - name: Upgrade base test tools
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-test
          . /tmp/venv-test/bin/activate
          pip3 install uv
          uv pip install tox tox-uv

      - name: Lint with flake8
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          tox -eflake8

      - name: Attempt to install requirements
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-reqs
          . /tmp/venv-reqs/bin/activate
          pip3 install uv
          uv pip install -r pyproject.toml

      - name: Run python3 unit tests
        timeout-minutes: 10
        run: |
          . /tmp/venv-test/bin/activate
          tox -epy3

      - name: List failing tests
        if: failure()
        id: failures
        run: |
          echo "Gathering list of failed tests..."
          touch /srv/ci/failed
          . /tmp/venv-test/bin/activate
          tox -efailing || true > /srv/ci/failed
          echo

          failed=$(cat /srv/ci/failed | egrep "^FAIL: " | \
              sed -z 's/FAIL: shakenfist_ci\.//g;s/\n/, /g;s/, $/\n/')

          echo "Failed tests:"
          cat /srv/ci/failed
          echo

          echo "failures<<EOF" >> ${GITHUB_OUTPUT}
          echo "${failed}" >> ${GITHUB_OUTPUT}
          echo "EOF" >> ${GITHUB_OUTPUT}
          echo "GITHUB_OUTPUT is:"
          cat ${GITHUB_OUTPUT}

      - name: Generate coverage report
        timeout-minutes: 10
        run: |
          . /tmp/venv-test/bin/activate
          tox -ecover
          zip -r cover.zip cover

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          retention-days: 90
          if-no-files-found: error
          path: cover.zip

  ovirt_matrix:
    # On a workflow_dispatch run, skip this job cleanly (neutral) when
    # its target was not selected, rather than running a step that calls
    # core.setFailed -- which reported an unselected target as red and
    # then left the always() artifact steps to time out against a guest
    # that was never provisioned. On pull_request both targets run.
    # The target name is a literal because the matrix context is not
    # available in a job-level if:; it mirrors the single matrix entry
    # below ('ovirt-45-rocky-8').
    if: github.event_name != 'workflow_dispatch' || contains(inputs.target, 'ovirt-45-rocky-8')
    name: "${{ matrix.test.description }}"
    strategy:
      fail-fast: false
      matrix:
        test: [
          {
            'name': 'ovirt-45-rocky-8',
            'description': 'oVirt 4.5 on Rocky 8',
            'environment_name': 'ovirt',
            'ovirt_rpm': 'centos-release-ovirt45',
            'base': 'rocky:8',
            'baseuser': 'cloud-user',
            'hostname': 'ovirt',
            'ovirt_username': 'admin@ovirt@internalsso'
          },
        ]
    runs-on: [self-hosted, vm]
    needs: sanity_checks
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.test.name }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Set environment variables
        shell: bash
        run: |
          echo "SF_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          echo "SHAKENFIST_NAMESPACE=$(hostname)" >> $GITHUB_ENV

      - name: Checkout the actions repository
        uses: actions/checkout@v4
        with:
          repository: shakenfist/actions
          path: actions
          fetch-depth: 0

      - name: Checkout kerbside
        uses: actions/checkout@v4
        with:
          path: kerbside
          fetch-depth: 0

      - name: Build infrastructure
        shell: bash
        run: |
          . $GITHUB_ENV
          ansible-playbook -i /home/debian/ansible-hosts \
              --extra-vars "identifier=${SHAKENFIST_NAMESPACE} base=${{ matrix.test.base }} environment_name=${{ matrix.test.environment_name }} hostname=${{ matrix.test.hostname }}" \
              --tags all ${GITHUB_WORKSPACE}/actions/ansible/kerbside-single-node.yml

      - name: Prepare /srv on target
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "sudo chown ${{ matrix.test.baseuser }}:${{ matrix.test.baseuser }} /srv"

      - name: Render oVirt answers file
        run: |
          sed 's|{{ ovirt_fqdn }}|ovirt.local|g' \
              ${GITHUB_WORKSPACE}/actions/etc/${{ matrix.test.name }}-answers.conf.j2 \
              > /tmp/${{ matrix.test.name }}-answers.conf

      - name: Copy tools and config to target
        run: |
          . $GITHUB_ENV

          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/actions/tools/ovirt-*.sh \
              ${GITHUB_WORKSPACE}/actions/tools/start-test-target.py \
              ${GITHUB_WORKSPACE}/kerbside/tools/test-ovirt-console.py \
              /tmp/${{ matrix.test.name }}-answers.conf \
              ${GITHUB_WORKSPACE}/actions/etc/${{ matrix.test.name }}-repos.patch \
              ${{ matrix.test.baseuser }}@10.0.2.2:/srv/

      - name: Install base packages
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "bash /srv/ovirt-install-base.sh"

      - name: Install upstream oVirt release package
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; sudo dnf install -y ${{ matrix.test.ovirt_rpm }}"

      - name: Apply repos patch
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; cd /etc/yum.repos.d; sudo patch -p1 < /srv/${{ matrix.test.name }}-repos.patch"

      - name: Enable Rocky 8 dnf modules for oVirt
        if: matrix.test.base == 'rocky:8'
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; sudo dnf module -y enable javapackages-tools postgresql:12 mod_auth_openidc:2.3 nodejs:14 pki-deps"

      - name: Further package configuration
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; sudo dnf update -y; sudo dnf distro-sync --nobest -y"

      - name: Install ovirt-engine
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; sudo dnf install -y ovirt-engine"

      - name: Setup ovirt-engine
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "set -xe; sudo engine-setup --config-append=/srv/${{ matrix.test.name }}-answers.conf"

      - name: Patch oVirt host-deploy OVN Ansible role
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "bash /srv/ovirt-patch-ovn.sh"

      - name: Prepare host for oVirt hypervisor
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "bash /srv/ovirt-prepare-host.sh"

      - name: Copy desktop disk image to target
        if: matrix.test.environment_name == 'ovirt'
        run: |
          . $GITHUB_ENV

          # Use the pre-cached desktop image (with qemu-guest-agent and
          # spice-vdagent pre-installed) from the CI runner
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              /srv/ci/cached/debian-12-gnome-agents \
              ${{ matrix.test.baseuser }}@10.0.2.2:/srv/debian-12-gnome-agents.qcow2

      - name: Create SPICE test target VM
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "python3 /srv/start-test-target.py \
                  --url https://${{ matrix.test.hostname }}.local/ovirt-engine/api \
                  --username ${{ matrix.test.ovirt_username }} \
                  --password foobar \
                  --ca-file /etc/pki/ovirt-engine/ca.pem \
                  --datacenter test \
                  --cluster test \
                  --storage-domain local-storage \
                  --host-address ${{ matrix.test.hostname }}.local \
                  --host-password foobar \
                  --storage-path /srv/ovirt-storage \
                  --disk-image /srv/debian-12-gnome-agents.qcow2"

      - name: Test SPICE console connectivity
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "python3 /srv/test-ovirt-console.py \
                  --url https://${{ matrix.test.hostname }}.local/ovirt-engine/api \
                  --username ${{ matrix.test.ovirt_username }} \
                  --password foobar \
                  --ca-file /etc/pki/ovirt-engine/ca.pem"

      - name: Gather artifacts
        if: always()
        run: |
          . $GITHUB_ENV

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              "bash /srv/ovirt-gather-artifacts.sh"

          mkdir -p /srv/github/artifacts/bundle/
          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2:/tmp/bundle.zip \
              /srv/github/artifacts/bundle/

          cd /srv/github/artifacts/bundle/
          unzip bundle.zip
          rm bundle.zip
          cd ..
          zip -r bundle.zip bundle

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-${{ matrix.test.name }}
          retention-days: 90
          if-no-files-found: error
          path: /srv/github/artifacts/bundle.zip

      - name: Retain the environment if requested
        if: github.event_name == 'workflow_dispatch'
        run: sleep $(( $MINUTES * 60 ))
        env:
          MINUTES: ${{ inputs.retention }}

  openstack_matrix:
    # On a workflow_dispatch run, skip this job cleanly (neutral) when
    # its target was not selected, rather than running a step that calls
    # core.setFailed -- which reported an unselected target as red and
    # then left the always() artifact steps to time out against a guest
    # that was never provisioned. On pull_request both targets run.
    # The target name is a literal because the matrix context is not
    # available in a job-level if:; it mirrors the single matrix entry
    # below ('kolla-ansible-master-debian-12').
    if: github.event_name != 'workflow_dispatch' || contains(inputs.target, 'kolla-ansible-master-debian-12')
    name: "${{ matrix.test.description }}"
    strategy:
      fail-fast: false
      matrix:
        test: [
          {
            'name': 'kolla-ansible-master-debian-12',
            'environment_name': 'kolla',
            'description': 'OpenStack via Kolla-Ansible master on Debian 12',
            'openstack_release': 'master',
            'base': 'debian:12',
            'baseuser': 'debian'
          },
        ]
    runs-on: [self-hosted, vm]
    needs: sanity_checks
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.test.name }}
      cancel-in-progress: true

    # NOTE(mikal): git repos are checked out to /srv/github/_work/{org}/{repo}
    # which is available as GITHUB_WORKSPACE. You can find other environment
    # variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

    steps:
      - name: Setup test environment
        uses: shakenfist/actions/setup-kerbside-environment@main
        with:
          base: ${{ matrix.test.base }}
          base_user: ${{ matrix.test.baseuser }}
          openstack_release: ${{ matrix.test.openstack_release }}
          topology: all-in-one

      - name: Checkout kerbside (for tempest plugin sources)
        uses: actions/checkout@v4
        with:
          path: kerbside
          fetch-depth: 0

      - name: Build patched repositories
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches; ./_build/assemble-source.sh --no-tarball ${{ matrix.test.openstack_release }}'

      - name: Inject PR's kerbside checkout into the build tree
        # assemble-source.sh clones kerbside's default branch, so without
        # this step the deployed container would have develop's code, not
        # the PR's. Replace the clone with the PR checkout so the kerbside
        # we build, deploy, and run Tempest against is what this PR ships.
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'sudo rm -rf /srv/shakenfist/kerbside-patches/src/kerbside'

          scp -rp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/kerbside \
              ${{ matrix.test.baseuser }}@10.0.2.2:/srv/shakenfist/kerbside-patches/src/kerbside

      - name: Bootstrap Kolla-Ansible
        run: |
          . $GITHUB_ENV

          script="cd /srv/shakenfist/kerbside-patches;"
          script="${script} sudo ./tools/bootstrap-kolla-ansible"
          script="${script} --image-tag ${{ matrix.test.openstack_release }}-debian-trixie-local"
          script="${script} --build-targets ${{ matrix.test.openstack_release }}"
          script="${script} --topology all-in-one;"

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 "${script}"

      - name: Apply kerbside CI globals overlay
        # bootstrap-kolla-ansible has just written
        # /etc/kolla/globals.yml from kerbside-patches' globals-master.yml.
        # Append this repo's overlay to disable Kolla-Ansible features
        # we do not need to test kerbside end to end -- kolla-ansible
        # reads globals.yml top-to-bottom so trailing keys win.
        run: |
          . $GITHUB_ENV
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${GITHUB_WORKSPACE}/kerbside/etc/kolla-ci-globals-overlay.yml \
              ${{ matrix.test.baseuser }}@10.0.2.2:/tmp/kolla-ci-globals-overlay.yml

          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'sudo bash -c "echo >> /etc/kolla/globals.yml && cat /tmp/kolla-ci-globals-overlay.yml >> /etc/kolla/globals.yml"'

      - name: Build container images
        # The build-images value is forwarded to kolla-build as a regex.
        # Restrict it to the services kerbside actually exercises end to
        # end -- kerbside itself, the OpenStack core needed to boot a
        # SPICE-enabled instance (nova, neutron, glance, keystone,
        # placement), and the infrastructure those depend on (haproxy,
        # keepalived, mariadb, rabbitmq, memcached, plus the
        # base/openstack-base/kolla-toolbox foundations). 'all' builds
        # 200+ images and is what kerbside-patches CI uses to catch
        # upstream regressions; we trade that breadth here for ~10
        # minutes off the build, with the cost that adding a new
        # kolla-side dependency to kerbside will require updating this
        # regex.
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches; ./_build/build-containers.sh --build-targets ${{ matrix.test.openstack_release }} --build-images "^(base|openstack-base|kolla-toolbox|cron|haproxy|httpd|keepalived|mariadb|memcached|openvswitch|proxysql|rabbitmq|keystone|glance|placement|neutron|nova|kerbside)" --distro debian --distro-version trixie --image-tag local'

      - name: Deploy Kolla-Ansible
        uses: shakenfist/actions/deploy-kolla-ansible@main
        with:
          base_user: ${{ matrix.test.baseuser }}
          image_tag: ${{ matrix.test.openstack_release }}-debian-trixie-local
          build_targets: ${{ matrix.test.openstack_release }}
          topology: all-in-one
          skip_bootstrap: 'true'

      - name: Test SPICE console connectivity
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches; sudo bash -c ". /etc/kolla/admin-openrc.sh && ./tools/test-console"'

      - name: Run Kerbside Tempest tests
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches/src/kerbside; sudo bash ./tools/run-tempest-tests'

      - name: Collect logs
        if: always()
        run: |
          . $GITHUB_ENV
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'cd /srv/shakenfist/kerbside-patches; sudo ./tools/gather-logs'
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2 \
              'if [ -d /srv/kerbside-tempest ]; then sudo zip -r /tmp/bundle.zip /srv/kerbside-tempest/logs /srv/kerbside-tempest/tempest/etc/tempest.conf 2>/dev/null || true; fi'
          scp -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ matrix.test.baseuser }}@10.0.2.2:/tmp/bundle.zip /tmp/bundle.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-${{ matrix.test.name }}
          retention-days: 90
          if-no-files-found: error
          path: /tmp/bundle.zip

      - name: Retain the environment if requested
        if: github.event_name == 'workflow_dispatch'
        run: sleep $(( $MINUTES * 60 ))
        env:
          MINUTES: ${{ inputs.retention }}
