name: Shaken Fist end-to-end functional test

permissions:
  contents: read

# A pull_request smoke gate since two-tier CI phase 2
# (docs/plans/PLAN-two-tier-ci-phase-02-sf-e2e-promotion.md); since
# phase 3 the "Can enqueue: sf-e2e" gate below is a required status
# check in the develop ruleset -- the merge_group trigger exists only
# so the required check reports (as skipped, which satisfies it) on
# queue entries; the lane itself runs on PRs, nightly, and on
# dispatch. The nightly schedule survives the promotion:
# build-smoke-cluster deploys Shaken Fist at develop HEAD, which moves
# independently of kerbside PRs, so the schedule catches SF-side drift
# no kerbside PR would surface.
on:
  merge_group:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      retention:
        description: 'Minutes to retain the environment after the run'
        required: false
        default: '0'
  schedule:
    # Nightly at 02:30 UTC.
    - cron: '30 2 * * *'

# A superseded push cancels the whole run -- gate included, so it
# reports cancelled rather than red on the old SHA -- instead of
# stacking 120-minute-timeout jobs on the small l pool. Merge-group
# refs are unique per queue entry, so this never cancels across
# entries.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Review-only changes touch no code the lane exercises; skip them.
  # A filter job rather than trigger-level paths-ignore because a
  # required check that never reports blocks the merge forever, while
  # a skipped one satisfies it. The filter only runs on pull_request;
  # schedule and dispatch runs default to code_changed=true. On
  # merge_group the whole job skips -- nothing consumes its output
  # there (the lane and gate skip on the event), so running it would
  # just burn a static-pool slot per queue entry. Keep the filter
  # list in sync with its other copies: the check_paths jobs in
  # functional-tests.yml and direct-qemu-functional.yml, the
  # trigger-level paths-ignore in codeql-analysis.yml, and the
  # .vscode whitelist in .gitignore.
  check_paths:
    name: "Check paths"
    if: github.event_name != 'merge_group'
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # 'every' requires a file to match ALL patterns; the default
          # ANY-match makes '**' defeat the exclusions.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!REVIEWS.md'
              - '!.vscode/*.weaudit'
              - '!.vscode/*.weaudit-shas.json'
              - '!.vscode/review-scope.toml'
      # Make the verdict visible in the log rather than inferred from
      # which downstream jobs skipped.
      - name: Report verdict
        run: echo "code_changed=${{ steps.filter.outputs.code || 'true (defaulted)' }}"

  sf-e2e:
    needs: check_paths
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, vm, debian-12, l]
    timeout-minutes: 120

    # The single-node SF API and kerbside both live on the primary and are
    # reached over the primary's localhost; the well-known CI system key is
    # what build-smoke-cluster provisions by default.
    env:
      SYSTEM_KEY: ci-system-key-do-not-use-in-production-ci-system-key
      KERBSIDE_URL: http://127.0.0.1:13002
      TOKEN_DURATION: '300'

    steps:
      - name: Setup test environment
        uses: shakenfist/actions/setup-test-environment@main

      - name: Build the smoke cluster
        id: cluster
        timeout-minutes: 90
        uses: shakenfist/actions/build-smoke-cluster@main
        with:
          topology: localhost
          system_key: ${{ env.SYSTEM_KEY }}

      - name: Checkout kerbside
        uses: actions/checkout@v7
        with:
          path: kerbside
          fetch-depth: 0

      - name: Install proxy-wheel build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin and ziglang
        run: |
          python3 -m venv "${RUNNER_TEMP}/wheelvenv"
          "${RUNNER_TEMP}/wheelvenv/bin/pip" install --quiet --upgrade pip maturin ziglang
          echo "${RUNNER_TEMP}/wheelvenv/bin" >> "$GITHUB_PATH"

      - name: Build the PR's proxy wheel (manylinux, matches the PyPI artifact)
        run: |
          WHEEL_OUT="${GITHUB_WORKSPACE}/kerbside/dist/proxy-wheels" \
              "${GITHUB_WORKSPACE}/kerbside/tools/build-proxy-wheel.sh" "$(uname -m)"

      - name: Deploy kerbside on the Shaken Fist primary
        uses: shakenfist/actions/deploy-kerbside-on-shakenfist@main
        with:
          base_user: debian
          primary: ${{ steps.cluster.outputs.primary }}
          system_key: ${{ env.SYSTEM_KEY }}
          kerbside_public_fqdn: ${{ env.KERBSIDE_URL }}
          token_duration: ${{ env.TOKEN_DURATION }}
          kerbside_src: ${{ github.workspace }}/kerbside
          proxy_wheel: ${{ github.workspace }}/kerbside/dist/proxy-wheels/*.whl

      - name: Import and boot the Sextant instance
        run: |
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              debian@${{ steps.cluster.outputs.primary }} \
              'bash /tmp/sf-e2e/kerbside/tools/sf-e2e/import-instance.sh'

      - name: Drive the happy path
        run: |
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              debian@${{ steps.cluster.outputs.primary }} \
              '/tmp/sf-e2e/venv/bin/python3 /tmp/sf-e2e/kerbside/tools/sf-e2e/drive-happy-path.py'

      - name: Drive the adversarial matrix
        run: |
          ssh -i /srv/github/id_ci -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              debian@${{ steps.cluster.outputs.primary }} \
              '/tmp/sf-e2e/venv/bin/python3 /tmp/sf-e2e/kerbside/tools/sf-e2e/drive-adversarial.py'

      - name: Gather artifacts
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/kerbside/tools/sf-e2e/gather-artifacts.sh" \
              debian ${{ steps.cluster.outputs.primary }} /tmp/sf-e2e-artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sf-e2e-artifacts-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: /tmp/sf-e2e-artifacts/

      - name: Retain the environment if requested
        # always() so a failed run still lingers for debugging -- that is
        # exactly when a live environment is most useful.
        if: always() && github.event_name == 'workflow_dispatch'
        run: sleep $(( $MINUTES * 60 ))
        env:
          MINUTES: ${{ inputs.retention }}

  # The aggregate gate whose display name is the required status check
  # in the develop ruleset -- do not rename it (or this workflow's
  # jobs) without updating the ruleset, or the queue wedges on a check
  # that never reports. The lane job itself must NOT be the required
  # check: if check_paths failed, GitHub would report the lane as
  # skipped, and a skipped required check counts as satisfied -- the
  # gate turns that check_paths failure into a visible red instead.
  # The jq treats a skipped need as satisfied, which is what lets a
  # review-only PR (lane skipped by the filter) pass. The gate also
  # runs on schedule and dispatch, where its verdict gates nothing --
  # harmless, and simpler than another event condition.
  can_enqueue_sf_e2e:
    name: "Can enqueue: sf-e2e"
    needs: [check_paths, sf-e2e]
    if: always() && github.event_name != 'merge_group'
    runs-on: [self-hosted, static]
    # A jq expression over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"

  # The nightly schedule is load-bearing: it bounds the accepted
  # two-tier CI risk that the merge queue never re-runs this lane
  # against the merged tree (and catches SF-at-develop-HEAD drift),
  # and a red entry in the Actions tab alerts nobody. File or update a
  # tracking issue instead. A separate job so issues: write is never
  # granted to the lane job.
  nightly_failure_issue:
    name: "File nightly failure issue"
    needs: [sf-e2e]
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    runs-on: [self-hosted, static]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: File or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tools/file-nightly-failure-issue.sh sf-e2e \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
