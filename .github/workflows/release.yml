# Release workflow for Kerbside
#
# Triggers on version tags (v*). Requires approval from the 'release'
# environment before publishing. Uses Sigstore for signing and PyPI
# trusted publishers for authentication.
#
# See RELEASE-SETUP.md for one-time configuration steps.

name: Release

permissions: {}

on:
  push:
    tags:
      - 'v*'

  # Allow manual trigger for testing (won't publish without a tag)
  workflow_dispatch:

jobs:
  build:
    name: Build distribution packages
    runs-on: [self-hosted, static]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history needed for setuptools_scm

      - name: Install build dependencies
        run: |
          rm -rf release-venv
          python3 -m venv release-venv
          release-venv/bin/pip3 install --upgrade pip
          release-venv/bin/pip3 install build twine

      # Stamp the exact kerbside-proxy version into the kerbside dependency
      # list so the released wheel pins the sibling package it was built
      # against (see tools/stamp-proxy-version.sh). Tag builds only; a
      # workflow_dispatch test build has no release version to stamp.
      - name: Stamp lockstep kerbside-proxy version
        if: startsWith(github.ref, 'refs/tags/v')
        run: tools/stamp-proxy-version.sh "${GITHUB_REF#refs/tags/v}"

      - name: Build package
        run: |
          # The stamp step above edits pyproject.toml to insert the proxy
          # pin, which dirties the git tree. setuptools_scm would then derive
          # a PEP 440 local version (e.g. 0.3.1.dev0+d<date>) that PyPI
          # rejects with a 400. For tag builds, pin the wheel version to the
          # tag so it is exactly the released version regardless of the
          # dirty tree. (workflow_dispatch has no tag; its derived dev
          # version is fine there since that build is never published.)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          release-venv/bin/python3 -m build

      - name: Check package with twine
        run: |
          release-venv/bin/twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  build-proxy-wheels:
    name: Build kerbside-proxy wheels
    # The vm/debian-12 runner carries the Rust build environment the crate
    # needs (same runner as rust.yml). aarch64 is cross-compiled here with
    # zig, so no aarch64 runner is required. xl: each matrix leg is a full
    # cold release build (native x86_64 or zig cross), which is CPU-bound;
    # be explicit, since an unsized vm label defaults to xs (1 core / 2 GB).
    runs-on: [self-hosted, vm, debian-12, xl]
    strategy:
      # Do not let one architecture's flake (or a runner dying mid-build)
      # cancel the other leg -- each arch is independent.
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for setuptools_scm-derived version

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config git python3-venv

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin and ziglang
        run: |
          python3 -m venv "${RUNNER_TEMP}/wheelvenv"
          "${RUNNER_TEMP}/wheelvenv/bin/pip" install --quiet --upgrade pip maturin ziglang setuptools_scm
          echo "${RUNNER_TEMP}/wheelvenv/bin" >> "$GITHUB_PATH"

      - name: Stamp lockstep version
        if: startsWith(github.ref, 'refs/tags/v')
        run: tools/stamp-proxy-version.sh "${GITHUB_REF#refs/tags/v}"

      - name: Build wheel
        run: tools/build-proxy-wheel.sh ${{ matrix.target }}

      - name: Upload proxy wheel
        uses: actions/upload-artifact@v7
        with:
          name: proxy-wheel-${{ matrix.target }}
          path: dist/proxy-wheels/*.whl

  # The four publishing jobs are guarded so that a workflow_dispatch
  # run only ever exercises the build and the twine check. The event
  # is tested as well as the ref because a dispatch can be aimed at a
  # tag: the ref test alone passes there, and the run re-signs and
  # force-pushes a tag that already exists, rewriting a signed object
  # someone may already have verified. Aimed at a branch instead, an
  # unguarded sign-tag computes a tag name of the literal string
  # "refs/heads/<branch>" and force-pushes a garbage
  # refs/tags/refs/heads/<branch> ref. Nothing is lost by requiring
  # push: re-running a failed release goes through "Re-run jobs",
  # which keeps the original push event.
  sign-tag:
    name: Sign release tag with Sigstore
    # Gate signing on ALL artifact builds, not just the Python sdist:
    # signing force-pushes the tag and is guarded by the release
    # environment approval, so it must not become eligible while the
    # proxy wheels are still building or have failed -- otherwise a dead
    # wheel build leaves the release wedged with signing queued.
    needs: [build, build-proxy-wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # This job mutates the runner -- it installs gitsign (sudo mv into
    # /usr/local/bin) and writes global git config -- so it belongs on an
    # ephemeral vm runner, not the shared static pool. Static grants no
    # passwordless sudo (the mv would fail) and carries no OS label, so
    # `[self-hosted, debian-12, static]` matched no runner and queued
    # forever. vm has sudo, is throwaway, and takes an OS + size label. s:
    # tiny job (download a binary, sign, push).
    runs-on: [self-hosted, vm, debian-12, s]
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitsign
        run: |
          GITSIGN_VERSION="0.14.0"
          curl -sLO "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          curl -sLO "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          chmod +x "gitsign_${GITSIGN_VERSION}_linux_amd64"
          sudo mv "gitsign_${GITSIGN_VERSION}_linux_amd64" /usr/local/bin/gitsign

      - name: Configure git for Sigstore signing
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global tag.gpgsign true
          git config --global gpg.format x509
          git config --global gpg.x509.program gitsign

      - name: Create signed tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Signing tag: ${TAG_NAME}"
          git tag -d "${TAG_NAME}" || true
          git tag -s "${TAG_NAME}" -m "Release ${TAG_NAME}" "${GITHUB_SHA}"
          git push origin "${TAG_NAME}" --force

  publish-proxy-pypi:
    name: Publish kerbside-proxy to PyPI
    needs: [build-proxy-wheels, sign-tag]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, static]
    environment: release

    permissions:
      id-token: write
      attestations: write

    steps:
      - name: Download proxy wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: proxy-wheel-*
          merge-multiple: true
          path: dist/

      - name: Generate attestations for artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent republish: the proxy and kerbside publish in
          # lockstep sequence, so a re-run after a partial failure must
          # not hard-error on a file PyPI already has.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    # kerbside exact-pins kerbside-proxy, so publish the proxy first: this
    # gate ensures kerbside is never published referencing a proxy version
    # that failed to publish.
    needs: [build, sign-tag, publish-proxy-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, static]
    environment: release

    permissions:
      id-token: write
      attestations: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Generate attestations for artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent republish: the proxy and kerbside publish in
          # lockstep sequence, so a re-run after a partial failure must
          # not hard-error on a file PyPI already has.
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [build, sign-tag, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, static]

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
