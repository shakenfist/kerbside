name: CodeQL

permissions: {}

# Review-only and docs-only changes cannot affect code analysis;
# skip them. This
# workflow may keep trigger-level paths-ignore because CodeQL is not a
# required status check (the check_paths workflows cannot -- see
# functional-tests.yml). Keep the path list in sync with its other
# copies: the check_paths jobs in functional-tests.yml,
# direct-qemu-functional.yml, and sf-e2e-functional.yml, and the
# .vscode whitelist in .gitignore.
on:
  push:
    branches: [develop]
    paths-ignore:
      - 'REVIEWS.md'
      - '.vscode/*.weaudit'
      - '.vscode/*.weaudit-shas.json'
      - '.vscode/review-scope.toml'
      - 'docs/**'
  pull_request:
    branches: [develop]
    paths-ignore:
      - 'REVIEWS.md'
      - '.vscode/*.weaudit'
      - '.vscode/*.weaudit-shas.json'
      - '.vscode/review-scope.toml'
      - 'docs/**'
  schedule:
    - cron: '0 17 * * 2'

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, static]
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Checkout PR head
        run: git checkout HEAD^2
        if: ${{ github.event_name == 'pull_request' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
