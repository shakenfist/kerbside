# Runs Renovate dependency updater hourly on a self-hosted runner.
#
# Template source: shakenfist/development/templates/renovate/

name: Renovate dependency updater

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  renovate:
    runs-on: [self-hosted, static]
    timeout-minutes: 30
    # timeout-minutes does not cover queue time: a static runner can sit
    # queued for a while under load, so an hourly cron can fire while
    # the previous run is still waiting for one, and workflow_dispatch
    # can collide with either. Two Renovate instances autodiscovering
    # the same repository race on branch creation and produce duplicate
    # or half-written pull requests.
    #
    # Not cancel-in-progress: killing Renovate mid-push is worse than
    # skipping an hour, and the next cron is an hour away.
    concurrency:
      group: renovate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_AUTODISCOVER: "true"
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
