name: Rust proxy

# Lint, test, and build the kerbside-proxy Rust crate. Scoped to the Rust crate
# and the gRPC proto it generates from, so Python-only changes don't trigger
# it. The full ryll-driven direct-qemu integration of the proxy is a separate
# lane.
permissions:
  contents: read

on:
  push:
    branches: [develop]
    paths:
      - 'rust/**'
      - 'kerbside/rpc/kerbside.proto'
      - 'tools/build-proxy-wheel.sh'
      - 'tools/stamp-proxy-version.sh'
      - 'tools/stamp-dev-proxy-version.sh'
      - 'tools/verify-wheel-stamping.sh'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'rust/**'
      - 'kerbside/rpc/kerbside.proto'
      - 'tools/build-proxy-wheel.sh'
      - 'tools/stamp-proxy-version.sh'
      - 'tools/stamp-dev-proxy-version.sh'
      - 'tools/verify-wheel-stamping.sh'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

jobs:
  rust:
    name: fmt / clippy / test / build
    # xl: a cold `cargo build --release` of the ring/rustls/aws-lc-rs/ryll
    # chain is CPU-bound and parallelises well. Be explicit -- an unsized
    # vm label defaults to xs (1 core / 2 GB) in private-ci.
    runs-on: [self-hosted, vm, debian-12, xl]
    defaults:
      run:
        # build.rs and the shakenfist-spice-protocol git dependency reference
        # ../../kerbside/rpc; running cargo from the crate dir (with the full
        # repo checked out) resolves it. protoc is vendored via
        # protoc-bin-vendored, so no system protobuf package is needed, and
        # the rustls `ring` provider needs no OpenSSL.
        working-directory: rust/kerbside-proxy
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the wheel-stamping guard dev-stamps with
          # setuptools_scm, which counts commits since the last v* tag.
          fetch-depth: 0

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config git python3-venv

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/kerbside-proxy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      # Packaging guard: build the wheel through tools/build-proxy-wheel.sh in
      # BOTH stamp modes (unstamped tree -> dev auto-stamp; release-stamped
      # tree -> exact version) and assert the produced filenames, so a
      # stamping regression surfaces on PRs and not at release time when the
      # tag already exists. Subsumes the old plain-maturin smoke build (the
      # native mode is the same maturin invocation; zig/manylinux stay
      # release-time concerns).
      - name: Install maturin and setuptools_scm
        run: |
          python3 -m venv "${RUNNER_TEMP}/wheelvenv"
          "${RUNNER_TEMP}/wheelvenv/bin/pip" install --quiet --upgrade pip maturin setuptools_scm
          echo "${RUNNER_TEMP}/wheelvenv/bin" >> "$GITHUB_PATH"

      - name: Verify wheel stamping (dev + release modes)
        working-directory: .
        run: tools/verify-wheel-stamping.sh
