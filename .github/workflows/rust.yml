name: Rust proxy

# Lint, test, and build this repository's Rust: the kerbside-proxy crate, and
# the standalone tools/quic-bench crate in a second job. Scoped to the Rust
# crates and the gRPC proto the proxy generates from, so Python-only changes
# don't trigger it. The full ryll-driven direct-qemu integration of the proxy
# is a separate lane.
#
# Path filters are per-workflow, not per-job, so a quic-bench-only change also
# starts the proxy job, and the reverse. Accepted: the alternative is a
# path-filter action choosing jobs at runtime, and with the cargo cache warm
# the extra job is cheap. The workflow keeps the name `Rust proxy` because
# branch protection names its checks after it.
permissions:
  contents: read

on:
  push:
    branches: [develop]
    paths:
      - 'rust/**'
      - 'tools/quic-bench/**'
      - 'kerbside/rpc/kerbside.proto'
      - 'tools/build-proxy-wheel.sh'
      - 'tools/stamp-proxy-version.sh'
      - 'tools/stamp-dev-proxy-version.sh'
      - 'tools/verify-wheel-stamping.sh'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'rust/**'
      - 'tools/quic-bench/**'
      - 'kerbside/rpc/kerbside.proto'
      - 'tools/build-proxy-wheel.sh'
      - 'tools/stamp-proxy-version.sh'
      - 'tools/stamp-dev-proxy-version.sh'
      - 'tools/verify-wheel-stamping.sh'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

jobs:
  rust:
    name: fmt / clippy / test / build
    # m (4 cores, 8 GB). This was xl on the theory that a cold release
    # build of the ring/rustls/aws-lc-rs/ryll chain parallelises well, but
    # the conductor measured 21 runs at xl averaging 0.8 busy cores with a
    # 5.9 GB peak working set, page cache included (#586), and a smaller
    # runner is admitted sooner when sfcbr is busy. Be explicit -- an
    # unsized vm label defaults to xs (1 core / 2 GB) in private-ci.
    runs-on: [self-hosted, vm, debian-13, m]
    defaults:
      run:
        # build.rs and the shakenfist-spice-protocol git dependency reference
        # ../../kerbside/rpc; running cargo from the crate dir (with the full
        # repo checked out) resolves it. protoc is vendored via
        # protoc-bin-vendored, so no system protobuf package is needed, and
        # the rustls `ring` provider needs no OpenSSL.
        working-directory: rust/kerbside-proxy
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the wheel-stamping guard dev-stamps with
          # setuptools_scm, which counts commits since the last v* tag.
          fetch-depth: 0

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config git python3-venv

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/kerbside-proxy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The experimental transcoding display channel is off by default and
      # kept out of the wheels (it builds openh264 from source), so only
      # these steps build it; without them a ryll pin bump could break it
      # unnoticed. The cargo cache keeps openh264 between runs.
      - name: Clippy (transcode feature)
        run: cargo clippy --all-targets --features transcode -- -D warnings

      - name: Test (transcode feature)
        run: cargo test --features transcode

      - name: Build (release)
        run: cargo build --release

      # Packaging guard: build the wheel through tools/build-proxy-wheel.sh in
      # BOTH stamp modes (unstamped tree -> dev auto-stamp; release-stamped
      # tree -> exact version) and assert the produced filenames, so a
      # stamping regression surfaces on PRs and not at release time when the
      # tag already exists. Subsumes the old plain-maturin smoke build (the
      # native mode is the same maturin invocation; zig/manylinux stay
      # release-time concerns).
      - name: Install maturin and setuptools_scm
        run: |
          python3 -m venv "${RUNNER_TEMP}/wheelvenv"
          "${RUNNER_TEMP}/wheelvenv/bin/pip" install --quiet --upgrade pip maturin setuptools_scm
          echo "${RUNNER_TEMP}/wheelvenv/bin" >> "$GITHUB_PATH"

      - name: Verify wheel stamping (dev + release modes)
        working-directory: .
        run: tools/verify-wheel-stamping.sh

  quic-bench:
    name: quic-bench fmt / clippy / test
    # s (2 cores, 4 GB), smaller than the proxy job: this crate's dependency
    # chain is a subset of the proxy's -- quinn and rustls with their defaults
    # off, so ring and no aws-lc-rs, no ryll and no protoc -- and this job
    # builds no release artefact. Be explicit -- an unsized vm label defaults
    # to xs (1 core / 2 GB) in private-ci.
    runs-on: [self-hosted, vm, debian-13, s]
    defaults:
      run:
        # A standalone cargo project, not a workspace member (its Cargo.toml
        # has an empty [workspace] table to keep it that way), with its own
        # Cargo.lock, so cargo runs from the crate dir. It has no path
        # dependency outside itself and needs no proto or protoc.
        working-directory: tools/quic-bench
    steps:
      - uses: actions/checkout@v7

      # ring compiles C and assembly, so a host compiler is needed; nothing
      # here wants pkg-config, python or OpenSSL.
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on this crate's own lockfile, separately from the proxy's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/quic-bench

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
