# TEMPORARY. Delete this file once the probe has run on a private-CI
# runner and its output has been recorded in
# docs/plans/PLAN-demo-install-phase-04-ci-lane.md.
#
# Why it exists: demo-compose.yml is the first container build in
# kerbside CI, and nothing in the tree establishes that these runners
# have a usable Docker daemon, a new enough BuildKit, or egress to a
# package index from inside a build. Phase 4 gates on the answer, so the
# question is asked by itself, once, rather than inferred from a red
# lane with a dozen possible causes.
#
# Why pull_request and not workflow_dispatch alone: GitHub only offers
# workflow_dispatch for workflows that exist on the default branch, so a
# dispatch-only probe on a feature branch cannot be triggered at all --
# which would have made this step impossible to execute before merge.
# The pull_request trigger is path-filtered to this workflow and the
# probe script, so it costs a runner only on the pull request that
# introduces them.

name: Demo runner probe

permissions:
  contents: read

on:
  pull_request:
    branches: [develop]
    paths:
      - 'tools/demo/probe-runner.sh'
      - '.github/workflows/demo-probe.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe the runner for docker
    # Same size as the lane this informs, so its timings mean something
    # for that lane. Never an unsized vm label: rust.yml:36-38 records
    # that one defaults to xs (1 core / 2 GB) in private-ci.
    runs-on: [self-hosted, vm, debian-12, l]
    timeout-minutes: 20

    # The runner image exports http_proxy/https_proxy at an upstream
    # squid. The probe itself talks only to the Docker socket and to
    # Docker Hub, but keep loopback off the proxy for consistency with
    # every other lane (direct-qemu-functional.yml:88-92).
    env:
      no_proxy: 127.0.0.1,localhost

    steps:
      - uses: actions/checkout@v7

      - name: Probe
        run: tools/demo/probe-runner.sh
