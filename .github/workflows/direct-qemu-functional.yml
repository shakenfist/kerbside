name: Direct-qemu functional test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - develop

jobs:
  direct-qemu-lane:
    runs-on: [self-hosted, vm, debian-12, l]
    timeout-minutes: 60

    # The runner image exports http_proxy/https_proxy pointing at an
    # upstream squid cache for apt, github, and the cargo registry.
    # Loopback traffic to kerbside on 127.0.0.1 must bypass that proxy
    # or squid returns 503 ERR_CONNECT_FAIL when it cannot route the
    # request back through itself.
    env:
      no_proxy: 127.0.0.1,localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Probe runner for KVM / qemu / OVMF
        run: bash tools/direct-qemu/probe-runner.sh

      - name: Grant runner user access to /dev/kvm
        run: sudo chmod a+rw /dev/kvm

      - name: Install system packages
        # Phase 6 step 6d (kerbside test-harness plan):
        # `cargo build --no-default-features -p ryll` no longer
        # links eframe/egui-winit/cpal/opus-decoder, so the runtime
        # libraries libgl1/libx11-6/libxcb1/libxkbcommon0/
        # libwayland-client0/libasound2 are no longer needed.  The
        # corresponding `-dev` packages stay because the cargo build
        # step still needs them at compile time (transitive build-
        # scripts probe them).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 ovmf openssl curl jq \
            mariadb-server \
            build-essential cmake pkg-config \
            libasound2-dev libxcb1-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libssl-dev default-libmysqlclient-dev \
            python3 python3-pip python3-venv

      - name: Ensure Rust toolchain
        run: |
          if cargo --version > /dev/null 2>&1; then
            echo "cargo already available: $(cargo --version)"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build ryll from main
        run: |
          git clone --depth 1 \
            https://github.com/shakenfist/ryll.git /tmp/ryll-src
          cd /tmp/ryll-src
          cargo build --release --no-default-features --features digest-decode -p ryll
          sudo install -m 755 target/release/ryll /usr/local/bin/ryll
          ryll --version || true

      - name: Install kerbside into venv
        run: |
          python3 -m venv /tmp/kerbside-venv
          /tmp/kerbside-venv/bin/pip install --quiet .
          echo "/tmp/kerbside-venv/bin" >> "$GITHUB_PATH"

      # Build the kerbside-proxy wheel and install it into the kerbside venv,
      # so find_proxy_bin() resolves it via shutil.which on PATH exactly as a
      # wheel-installed deployment would (phase 6). Runs after the venv exists
      # and before the daemon starts.
      - name: Build and install the Rust proxy wheel
        run: |
          python3 -m venv "${RUNNER_TEMP}/maturin-venv"
          "${RUNNER_TEMP}/maturin-venv/bin/pip" install --quiet maturin
          PATH="${RUNNER_TEMP}/maturin-venv/bin:$PATH" tools/direct-qemu/install-proxy-wheel.sh --venv /tmp/kerbside-venv

      - name: Initialize MariaDB
        run: tools/direct-qemu/setup-mariadb.sh

      # Prove API-driven session termination drops an in-flight connection,
      # end to end through the DB intent table + the daemon's ProxyControl
      # poll. Runs on its own isolated lane (separate WORKDIR, torn down
      # here) before the scenario lane, so it neither disturbs nor is
      # disturbed by it.
      - name: Verify API-terminate drops the in-flight connection
        run: tools/direct-qemu/verify-terminate-live.sh

      # Non-gating: measure keypress-to-screen latency through the proxy and
      # record p50/p95 as an artifact. The orchestrator injects real keypresses
      # (send_key), which drives the Sextant guest off its Awaiting screen, so
      # -- like the terminate test above -- it runs on its OWN isolated lane
      # (separate WORKDIR, torn down inside the script) BEFORE the scenario
      # lane, and therefore neither disturbs nor is disturbed by it.
      # continue-on-error keeps a measurement hiccup from failing the lane.
      # (The Python baseline for the comparison lives in phase-7 history.)
      - name: Latency loadtest (non-gating)
        continue-on-error: true
        run: tools/direct-qemu/run-loadtest.sh

      - name: Bring up the lane
        run: tools/direct-qemu/lane-up.sh

      - name: Run smoke client
        run: |
          set -o pipefail
          python3 tools/direct-qemu/smoke-client.py \
            /tmp/kerbside-ci/ryll-ci.sock \
            2>&1 | tee /tmp/kerbside-ci/smoke-client.log

      - name: Assert Sextant boot banner
        run: tools/direct-qemu/wait-for-banner.sh /tmp/kerbside-ci/sextant-serial.log 30

      - name: Run Sextant scenario test
        run: |
          set -o pipefail
          tools/direct-qemu/run-scenario.sh \
            2>&1 | tee /tmp/kerbside-ci/tempest.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-qemu-artifacts-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/kerbside-ci/kerbside.log
            /tmp/kerbside-ci/kerbside.log.gunicorn-access
            /tmp/kerbside-ci/kerbside.log.gunicorn-error
            /tmp/kerbside-ci/sextant-serial.log
            /tmp/kerbside-ci/ryll-ci.stderr
            /tmp/kerbside-ci/ryll-ci.stdout
            /tmp/kerbside-ci/console.vv
            /tmp/kerbside-ci/smoke-client.log
            /tmp/kerbside-ci/tls/
            /tmp/kerbside-ci/sources.yaml
            /tmp/kerbside-ci/scenario/
            /tmp/kerbside-ci/tempest.log
            /tmp/terminate-artifacts/
            /tmp/loadtest-artifacts/

      - name: Tear down the lane
        if: always()
        run: tools/direct-qemu/lane-down.sh

      # Phase 2 of PLAN-host-subject: prove backend host_subject enforcement
      # end to end (accept a matching pin, refuse a mismatched one) against a
      # real TLS-enabled qemu backend. Runs on the standalone Rust-proxy
      # harness (tools/direct-qemu/verify-rust-proxy.sh), AFTER the main
      # lane's teardown above, because both lanes bind the same default
      # ports (proxy 5900/5901, qemu SPICE 5910) -- running concurrently
      # would collide.
      - name: Host subject enforcement checks
        run: tools/direct-qemu/run-host-subject-checks.sh

      - name: Upload host-subject-checks artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-qemu-host-subject-artifacts-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/kerbside-host-subject-checks-match/rust-proxy.log
            /tmp/kerbside-host-subject-checks-match/mock-grpc.log
            /tmp/kerbside-host-subject-checks-match/sextant-serial.log
            /tmp/kerbside-host-subject-checks-match/console.vv
            /tmp/kerbside-host-subject-checks-match/ryll-ci.stdout
            /tmp/kerbside-host-subject-checks-match/ryll-ci.stderr
            /tmp/kerbside-host-subject-checks-match/tls/
            /tmp/kerbside-host-subject-checks-mismatch/rust-proxy.log
            /tmp/kerbside-host-subject-checks-mismatch/mock-grpc.log
            /tmp/kerbside-host-subject-checks-mismatch/sextant-serial.log
            /tmp/kerbside-host-subject-checks-mismatch/console.vv
            /tmp/kerbside-host-subject-checks-mismatch/ryll-ci.stdout
            /tmp/kerbside-host-subject-checks-mismatch/ryll-ci.stderr
            /tmp/kerbside-host-subject-checks-mismatch/tls/
