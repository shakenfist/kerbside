# actionlint configuration for Kerbside.
#
# Declares custom labels used by our self-hosted CI runners so that
# `runs-on: [self-hosted, <label>]` lines do not trigger "unknown label"
# warnings.

self-hosted-runner:
  labels:
    - static
    - vm
    - debian-12
    - debian-12-docker
    # Ephemeral runner sizes (see shakenfist/private-ci CI_SIZES). An
    # unsized vm job defaults to xs, so jobs set one explicitly.
    - xs
    - s
    - m
    - m-bigdisk
    - l
    - xl
    - xl-bigdisk
    - claude-code

# Ignore certain shellcheck rules from run: blocks in workflow files.
# These are overly pedantic for CI workflow scripts where the inputs are
# controlled by GitHub Actions expressions.
paths:
  .github/workflows/*.yml:
    ignore:
      - 'SC1090:'  # Can't follow non-constant source
      - 'SC2046:'  # Quote command substitution to prevent word splitting
      - 'SC2086:'  # Double quote to prevent globbing and word splitting
      - 'SC2143:'  # Use grep -q instead of comparing output with [ -n .. ]
