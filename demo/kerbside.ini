####################################################################
# Demo configuration, in the INI form kerbside reads from
# /etc/kerbside/kerbside.ini.
#
# The demo ships both configuration mechanisms on purpose, because
# which one wins is worth seeing rather than reading about:
#
#   * docker-compose.yml sets the deployment-shaped things as
#     KERBSIDE_* environment variables -- the database URL, the
#     public FQDN, the certificate paths.
#   * this file sets the rest.
#
# Environment variables win. Every key here is only applied if the
# matching KERBSIDE_ variable is not already set, so anything also
# listed in docker-compose.yml's `environment:` overrides this file.
# The settings below are deliberately ones the compose file does not
# set, so they demonstrably take effect.
#
# etc/kerbside.conf.example in the repository root documents all 34
# settings and their defaults. Note the percent-sign rule there: a
# literal % must be doubled in this file, and kerbside currently exits
# *successfully* if the file fails to parse (issue #313), so a stray
# percent takes the container down without an error message.
#
# The JWT signing seed is NOT here. entrypoint.sh generates it per
# deployment into the state volume and exports it, so no secret is
# ever written to a file committed to this repository -- which is the
# failure issue #131 describes.
####################################################################

[kerbside]

# Names this node in the logs and the web UI. Set here rather than in
# the compose file so that it is visible proof the INI file was read.
node_name = kerbside-demo

# The demo's SPICE firewall stays in its default enforcing mode: the
# proxy inspects every relayed message and drops anything outside the
# permitted channel and message-type grammar. Left explicit because a
# demo of a security proxy should show the security being on.
firewall_mode = enforce

# How long a console access token is valid for, in minutes. The
# default of 1 is short enough to be surprising when a .vv sits unused
# in a terminal for a while; 5 makes the demo forgiving without being
# a different thing from the default.
console_token_duration = 5
