# Pre-commit hooks for Kerbside
#
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# For actionlint, install the binary:
#   - macOS: brew install actionlint
#   - Linux: https://github.com/rhysd/actionlint/releases

repos:
  # GitHub Actions workflow linter
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        description: Static checker for GitHub Actions workflow files

  # Trailing whitespace, end-of-file, basic hygiene.
  # Vendored Bootstrap assets under kerbside/api/static/{css,js}/ are
  # excluded so we do not gratuitously modify upstream files.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^kerbside/api/static/(css|js)/
      - id: end-of-file-fixer
        exclude: ^kerbside/api/static/(css|js)/
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Flake8 style checking via tox
  # Requires: pip install tox flake8
  - repo: local
    hooks:
      - id: flake8
        name: Style check with flake8
        description: Run flake8 style checks on changes since HEAD~
        entry: tox -e flake8
        language: system
        files: ^kerbside/|^tempest-plugin/|^tools/
        pass_filenames: false
        types: [python]

  # Unit tests via tox
  # Requires: pip install tox
  - repo: local
    hooks:
      - id: py3
        name: Run unit tests
        description: Run Python 3 unit tests with stestr
        entry: tox -e py3
        language: system
        files: ^kerbside/|^tempest-plugin/
        pass_filenames: false
        types: [python]
