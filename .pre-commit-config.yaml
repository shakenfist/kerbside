# Pre-commit hooks for Kerbside
#
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# For actionlint, install the binary:
#   - macOS: brew install actionlint
#   - Linux: https://github.com/rhysd/actionlint/releases

repos:
  # GitHub Actions workflow linter
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        description: Static checker for GitHub Actions workflow files
        args: ['-config-file', '.github/actionlint.yaml']

  # Shell script linter for our tools/ scripts.
  # Keep rev in lockstep with tox.ini's [testenv:shellcheck] deps pin:
  # CI runs the tox environment, developers run this hook, and bumping
  # only one of them makes the two disagree about what passes. The
  # "shellcheck" group in renovate.json proposes both in one pull
  # request, and that grouping only works because renovate.json also
  # teaches Renovate to read upstream's four-component tags -- without
  # it the lookup here fails outright and the tox pin moves alone.
  # Proposing is not enforcing, though: tools/shellcheck-wrap.sh
  # compares the two pins and fails `tox -e shellcheck` if they
  # disagree, so a hand bump of one of them is caught rather than
  # having to be remembered.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(tools|demo)/
        types_or: [sh, bash, shell]
        args: ['-x']

  # skillsaw lints the agent context -- AGENTS.md and the skills under
  # .claude/skills/ -- for malformed frontmatter, embedded credentials
  # and invisible-unicode smuggling. Agent context is code an agent
  # executes against, and it is the material the credential scan is
  # least likely to be pointed at. The same linter runs in CI
  # (sanity_checks), because a hook is advisory: it can be skipped with
  # --no-verify or by a clone that never ran `pre-commit install`.
  #
  # Keep rev in lockstep with functional-tests.yml's skillsaw pin, for
  # the same reason as shellcheck above: CI installs that pin,
  # developers run this hook, and bumping only one of them makes the
  # two disagree about what passes. The "skillsaw" group in
  # renovate.json proposes both in one pull request.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.21.0
    hooks:
      - id: skillsaw

  # Documentation names code by symbol, never by line number. A
  # `file.py:123` reference goes stale on the next edit to that file,
  # and the edit is usually in a pull request that never touches the
  # document, so nothing notices: several in docs/use-cases/ had
  # already drifted when they were removed. Name the function or class
  # instead. A GitHub #L anchor is allowed only on a link pinned to a
  # commit sha, which cannot drift. Plans are exempt: they are dated
  # records of the code as it was when they were written. The
  # docs-line-references consistency audit in shakenfist/development
  # sweeps the whole tree as well, since a hook can be skipped.
  - repo: local
    hooks:
      - id: docs-line-references
        name: No source line-number references in documentation
        language: pygrep
        entry: >-
          \b[\w./-]+\.(py|pyi|rs|go|sh|proto|js|ts|c|h|cc|cpp|toml|ya?ml|j2|html):\d+(?:[-,]\d+)*(?![\d:])|/blob/(?![0-9a-f]{40}/)[^\s)#]+#L\d+
        types: [markdown]
        exclude: (^|/)plans/

  # Trailing whitespace, end-of-file, basic hygiene.
  # The vendored sfui copy under kerbside/api/static/sfui/ is
  # excluded so we do not gratuitously modify upstream files.
  #
  # The weAudit review marks under .vscode/ are excluded from the two
  # rewriting hooks as well. They are generated by the weAudit
  # extension and tools/review-tracking.sh, never hand-edited, and the
  # generator emits no trailing newline -- so end-of-file-fixer
  # rewrote mikal.weaudit on every `pre-commit run --all-files`, and
  # reported a failure nobody could fix: committing the newline just
  # meant the next regen dropped it again.
  #
  # Deliberately scoped to these two hooks rather than set as a
  # top-level exclude. Review notes are prose, so hiding them from
  # every hook would also hide them from a content scanner -- which
  # now exists: the credential_scan job reads them like any other
  # file. See docs/code-review-tracking.md in shakenfist/development.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(kerbside/api/static/sfui/|\.vscode/.*\.weaudit)
      - id: end-of-file-fixer
        exclude: ^(kerbside/api/static/sfui/|\.vscode/.*\.weaudit)
      - id: check-yaml
        # The ansible role's templates are Jinja that renders to YAML,
        # not YAML: sources.yaml opens with a {%- set %} block.
        exclude: ^ansible/roles/[^/]+/templates/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # Flake8 style checking via tox
  # Requires: pip install tox flake8
  - repo: local
    hooks:
      - id: flake8
        name: Style check with flake8
        description: Run flake8 style checks on changes since HEAD~
        entry: tox -e flake8
        language: system
        files: ^kerbside/|^tempest-plugin/|^tools/
        pass_filenames: false
        types: [python]

  # Unit tests via tox
  # Requires: pip install tox
  - repo: local
    hooks:
      - id: py3
        name: Run unit tests
        description: Run Python 3 unit tests with stestr
        entry: tox -e py3
        language: system
        # ansible/ and the host-subject fixture are here because
        # kerbside/tests/unit/test_ansible_role.py reads the role's
        # defaults, argument specs and host subject script, and the
        # fixture it holds that script to.
        files: >-
          ^(kerbside/|tempest-plugin/|ansible/|tests/fixtures/host-subject-renderings\.json$)
        pass_filenames: false
        types_or: [python, yaml, json]

  # The shakenfist.kerbside collection under ansible/. Both hooks need
  # ansible-core and ansible-lint on PATH (pip install ansible-lint),
  # and the role test needs openssl too. CI runs the same two checks in
  # sanity_checks, and adds galaxy-importer over the built tarball
  # (tools/ci-check-ansible-collection.sh), which is too heavy a
  # dependency to ask of every clone.
  - repo: local
    hooks:
      - id: ansible-lint
        name: Lint the ansible collection
        description: Run ansible-lint over ansible/ with its configuration
        entry: ansible-lint -c ansible/.ansible-lint ansible/
        language: system
        files: ^ansible/
        pass_filenames: false

      - id: test-ansible-role
        name: Test the ansible role
        description: Drive the kerbside role's validate, bootstrap and config entry points, rootless
        entry: tools/ci-test-ansible-role.sh
        language: system
        files: ^(ansible/|tools/ci-test-ansible-role\.sh$)
        pass_filenames: false
