# Which files are subject to whole-file review (see
# shakenfist/development docs/code-review-tracking.md). Patterns are
# fnmatch-style against repo-relative paths; '*' matches across
# directory separators. An empty include list would mean all tracked
# files.
#
# The lists are enumerated rather than left as `include = []` (which
# would mean every tracked file, leaning entirely on `exclude`). With
# 316 tracked files, a vendored sfui tree, generated protobuf stubs,
# exported GitHub configuration, two qcow2 fixtures and a Cargo.lock,
# the exclude list needed to make that behave would be longer than the
# include list it replaced -- and it would give up the property that
# an unfamiliar file type fails the review-scope-completeness audit
# loudly instead of joining the review queue in silence.
#
# What is included, and why:
#
# - Python, Rust, shell, JavaScript and protobuf definitions are the
#   executable artifacts.
# - YAML is executable in practice: the CI workflows decide what runs,
#   with which permissions, against which secrets.
# - Markdown documentation (README, ARCHITECTURE, AGENTS, docs/
#   guides, the .claude/ agent instructions, and the runbooks under
#   tools/) drifts out of sync just as quietly as code and benefits
#   from periodic re-reading.
# - The Jinja templates under kerbside/api/templates/ render the web
#   UI. Autoescape behaviour and any |safe filter live in these files
#   and nowhere else, so they are part of the same attack surface as
#   the endpoints that render them, not decoration.
# - Packaging and tool configuration -- pyproject.toml, Cargo.toml,
#   tox.ini, alembic.ini, renovate.json, bindep.txt, .stestr.conf,
#   the Dockerfiles and the rust Makefile -- decides what gets built,
#   installed and published. .gitleaks.toml decides what the
#   credential scan catches, so an over-broad allow rule there is a
#   hole that hides holes.
# - The ignore files are included for the same reason: .dockerignore
#   decides what ends up inside a published image.
# - Three files carry no extension and so are named individually:
#   tools/run-tempest-tests is a shell script, demo/kerbside-demo-env
#   is sourced environment, and etc/kerbside.conf.example is matched
#   by *.example.
#
# What is excluded, and why. Each entry is a decision somebody made;
# a file that matches nothing in `include` is not a decision, which
# is what the review-scope-completeness audit exists to catch.
#
# - docs/plans/* -- plan files are point-in-time records of intended
#   work, not living artifacts, and would swamp the queue.
# - *_pb2* -- protoc output, generated by tools/gen-protos.sh.
#   Reviewing it attests to the generator's output rather than to
#   anything a human wrote.
# - kerbside/api/static/sfui/* -- a verbatim vendored copy of the
#   shakenfist/sfui design system, not code we wrote.
# - .github/exported-config/* -- written by export-repo-config.yml
#   from the live GitHub configuration. The settings are reviewed on
#   GitHub; this is a machine-written archive of them.
# - rust/kerbside-proxy/Cargo.lock -- generated by cargo from
#   Cargo.toml, which is reviewed.
# - docs/schema.html -- generated from the database models, not
#   authored.
# - tests/fixtures/*.qcow2 -- disk images. Spelled by extension and
#   not as tests/fixtures/*, which would also drop the README beside
#   them, and that is prose somebody wrote.
# - AUTHORS and LICENSE -- not authored here.
include = [
    # Executable artifacts.
    '*.py',
    '*.pyi',
    '*.rs',
    '*.sh',
    '*.js',
    '*.proto',
    'tools/run-tempest-tests',
    # Executable in practice: CI, containers, build and packaging.
    '*.yml',
    '*.yaml',
    '*.toml',
    '*.ini',
    '*.json',
    '*.cfg',
    '*.conf',
    '*.txt',
    '*.example',
    '*Dockerfile',
    'Makefile',
    '*/Makefile',
    '*.dockerignore',
    '*.gitignore',
    'demo/kerbside-demo-env',
    # The rendered web surface.
    '*.html',
    '*.mako',
    '*.svg',
    # Documentation.
    '*.md',
]
exclude = [
    'docs/plans/*',
    '*_pb2.py',
    '*_pb2.pyi',
    '*_pb2_grpc.py',
    '*_pb2_grpc.pyi',
    'kerbside/api/static/sfui/*',
    '.github/exported-config/*',
    'rust/kerbside-proxy/Cargo.lock',
    'docs/schema.html',
    'tests/fixtures/*.qcow2',
    'AUTHORS',
    'LICENSE',
]
