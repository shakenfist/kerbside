# Which files are subject to whole-file review (see
# shakenfist/development docs/code-review-tracking.md). Patterns are
# fnmatch-style against repo-relative paths; '*' matches across
# directory separators. An empty include list would mean all tracked
# files.
#
# Python, Rust, shell, JavaScript, and protobuf definitions are the
# executable artifacts; the YAML is executable in practice (the CI
# workflows decide what runs, with which permissions, against which
# secrets, and etc/ carries the deployment configuration); the
# Markdown documentation (README, ARCHITECTURE, AGENTS, docs/
# guides, the .claude/ agent instructions, and the runbooks under
# tools/) is included too, since docs drift out of sync just as
# quietly as code and benefit from periodic re-reading.
#
# docs/plans/ is excluded: plan files are point-in-time records of
# intended work, not living artifacts, and would swamp the queue.
# protoc output (*_pb2* Python modules and stubs, generated by
# tools/gen-protos.sh) is excluded because reviewing it attests to
# the generator's output rather than to anything a human wrote.
# kerbside/api/static/sfui/ is excluded because it is a verbatim
# vendored copy of the shakenfist/sfui design system, not code we
# wrote.
include = ['*.py', '*.pyi', '*.rs', '*.sh', '*.js', '*.proto', '*.md', '*.yml', '*.yaml']
exclude = [
    'docs/plans/*',
    '*_pb2.py',
    '*_pb2.pyi',
    '*_pb2_grpc.py',
    '*_pb2_grpc.pyi',
    'kerbside/api/static/sfui/*',
]
