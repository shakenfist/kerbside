[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm[simple]>=6.2",
    "wheel",
    "build",
    "twine"
]
build-backend = "setuptools.build_meta"

[project]
name = "kerbside"
dynamic = ["version"]

description = "A protocol native SPICE VDI proxy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shakenfist-utilities==0.8.8",      # apache2

    # The Rust SPICE proxy binary is shipped as a separate maturin bin
    # wheel (kerbside-proxy), released in lockstep from the same v* tag.
    # The line below is a dev-inclusive FLOOR, not the release pin: naming
    # a .dev0 version in the specifier is what opts pip into pre-release
    # resolution, so git/dev installs resolve the newest proxy wheel on
    # PyPI -- a release or a rolling dev wheel published by
    # .github/workflows/dev-proxy-wheel.yml when the binary's inputs
    # change. At release time tools/stamp-proxy-version.sh REPLACES this
    # line with the exact kerbside-proxy==X.Y.Z lockstep pin (the
    # KERBSIDE_PROXY_PIN marker below anchors that and marks the line for
    # readers). A dev checkout can still override resolution entirely via
    # KERBSIDE_PROXY_BIN or a locally built rust/kerbside-proxy tree
    # (find_proxy_bin()).
    "kerbside-proxy>=0.4.0.dev0",       # apache2
    # KERBSIDE_PROXY_PIN

    "click==8.5.0",                     # bsd
    "cryptography==50.0.1",             # apache2
    "pylogrus==0.4.0",                  # mit
    "prometheus-client==0.26.0",        # apache2
    "Flask==3.1.3",                     # bsd
    "Flask-RESTful==0.3.10",            # bsd
    "flasgger==0.9.7.1",                # mit
    "flask-jwt-extended==4.7.4",        # mit
    "bcrypt==5.0.0",                    # apache2
    "gunicorn==26.2.0",                 # mit
    "flask-request-id-middleware==1.1", # mit
    "pyyaml==6.0.3",                    # mit
    "psutil==7.2.2",                    # bsd
    "PyMySQL==1.2.0",                   # mit
    "webargs==8.7.1",                   # mit

    # All four of these are imported here but were, until now, declared
    # only by the generated block below -- an import resting on whatever
    # some other library happened to require. requests is the one that
    # collected: shakenfist-utilities 0.8.8 dropped the oslo stack that
    # had been pulling requests (and, through it, urllib3) in, so the
    # next reconcile removed both pins and the daemon stopped importing.
    # PyJWT and packaging still arrive transitively -- from
    # flask-jwt-extended and marshmallow respectively -- but that is the
    # same coincidence, just one that has not ended yet.
    #
    # requests is imported by the API and the oVirt source, PyJWT (as
    # "jwt") by the Shaken Fist token verifier. packaging and urllib3
    # are imported only by the test suite
    # (kerbside/tests/unit/test_proxy_floor.py) and the oVirt end to end
    # harness (tools/ovirt-e2e/gen-sources.py); they are declared here
    # rather than in the test extra because [project] dependencies is
    # the only array the undeclared direct dependency audit reads, and
    # because both are installed by an ordinary install regardless.
    "packaging==26.3",                  # apache2/bsd
    "PyJWT==2.13.0",                    # mit
    "requests==2.34.2",                 # apache2
    "urllib3==2.7.0",                   # mit

    # These must move as a set. pydantic-core is deliberately NOT pinned
    # here: each pydantic release exact-pins its matching pydantic-core, so
    # a pin of our own is either redundant or conflicting (see PR #198).
    # The pin-indirect-dependencies workflow and renovate.json both know to
    # leave pydantic-core alone.
    # never-pin: pydantic-core
    "pydantic==2.13.5",                 # mit
    "pydantic-settings==2.15.0",        # mit
    "typing-extensions==4.16.0",        # (indirect dependency)

    # These also move as a set
    "alembic==1.19.2",                  # mit
    "sqlalchemy==2.0.52",               # mit
    "mysqlclient==2.2.8",               # gpl

    # gRPC service (KerbsideProxy) fronting the database for the proxy.
    # protobuf is pinned to the version the checked-in stubs were
    # generated against; regenerate via `tox -egenprotos` if bumped.
    "grpcio==1.83.1",                   # apache2
    "protobuf==7.36.1",                 # bsd

    # Optional dependancies, depending on what clouds you want to provide access to
    # shakenfist-client               # apache2
    # ovirt-engine-sdk-python>=4.6.1  # apache2
    # keystoneauth1                   # apache2
    # openstacksdk                    # apache2
    # python-keystoneclient           # apache2

    # Indirect dependencies. We do not track license for these. This block
    # is regenerated by tools/pin-indirect-dependencies.sh, so do not edit
    # it by hand -- add direct dependencies above the marker instead.
    # START_OF_INDIRECT_DEPS
    "aniso8601==10.0.1",
    "annotated-types==0.8.0",
    "attrs==26.1.0",
    "blinker==1.9.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.1",
    "greenlet==3.5.5",
    "idna==3.19",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "jsonschema-specifications==2025.9.1",
    "jsonschema==4.26.0",
    "Mako==1.4.1",
    "MarkupSafe==3.0.3",
    "marshmallow==4.3.1",
    "mistune==3.3.4",
    "pycparser==3.0",
    "python-dotenv==1.2.3",
    "pytz==2026.3.post1",
    "referencing==0.37.0",
    "rpds-py==0.30.0",
    "setproctitle==1.3.7",
    "six==1.17.0",
    "typing-inspection==0.4.4",
    "Werkzeug==3.1.8",
    # END_OF_INDIRECT_DEPS
]

[project.urls]
"Homepage" = "https://shakenfist.com"
"Bug Tracker" = "https://github.com/shakenfist/kerbside/issues"

[project.scripts]
kerbside = "kerbside.main:cli"

[tool.setuptools]
packages = ["kerbside", "kerbside.rpc"]

[tool.setuptools_scm]
git_describe_command = "git describe --dirty --tags --match v* --first-parent"
write_to = "kerbside/_version.py"

[project.optional-dependencies]
test = [
    "coverage",            # apache2
    "testtools",           # mit
    "mock",                # bsd
    "stestr",              # apache2
    "tox",                 # mit
    "flake8",              # mit

    # protobuf / gRPC code generation (tox -egenprotos). Pinned to
    # match the runtime grpcio/protobuf so regeneration is deterministic.
    "grpcio-tools==1.83.1",            # apache2
    "mypy-protobuf==5.1.0",           # apache2

    # The Shaken Fist source calls
    # shakenfist_client.get_vdi_token_public_keys() (sources/shakenfist.py),
    # added in shakenfist-client 0.8.3. Pin that floor so both dev and the
    # PyPI-installing CI resolve a client that ships the method. See the
    # VDI console tokens plan.
    "shakenfist-client>=0.8.3",        # apache2
    #"ovirt-engine-sdk-python>=4.6.1",  # apache2
    "keystoneauth1",                   # apache2
    "openstacksdk>=4.5.0",             # apache2
]
