[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm[simple]>=6.2",
    "wheel",
    "build",
    "twine"
]
build-backend = "setuptools.build_meta"

[project]
name = "kerbside"
dynamic = ["version"]

description = "A protocol native SPICE VDI proxy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "shakenfist-utilities==0.8.4",      # apache2

    "click==8.1.7",                     # bsd
    "cryptography",                     # apache2
    "pylogrus",                         # mit
    "setproctitle==1.3.3",              # bsd
    "prometheus-client==0.20.0",        # apache2
    "Flask==3.1.3",                     # bsd
    "Flask-RESTful==0.3.10",            # bsd
    "flasgger==0.9.7.1",                # mit
    "flask-jwt-extended==4.6.0",        # mit
    "bcrypt==4.1.2",                    # apache2
    "gunicorn==22.0.0",                 # mit
    "flask-request-id-middleware==1.1", # mit
    "pyyaml==6.0.1",                    # mit
    "psutil==7.0.0",                    # bsd
    "PyMySQL==1.1.1",                   # mit
    "webargs==8.3.0",                   # mit

    # These must move as a set
    "pydantic==2.12.4",                 # mit
    "pydantic-settings==2.14.2",        # mit
    "pydantic-core==2.41.5",            # (indirect dependency)
    "typing-extensions==4.14.1",        # (indirect dependency)

    # These also move as a set
    "alembic==1.17.2",                  # mit
    "sqlalchemy==2.0.36",               # mit
    "mysqlclient==2.1.1",               # gpl

    # gRPC service (KerbsideProxy) fronting the database for the proxy.
    # protobuf is pinned to the version the checked-in stubs were
    # generated against; regenerate via `tox -egenprotos` if bumped.
    "grpcio==1.81.1",                   # apache2
    "protobuf==6.33.6",                 # bsd

    # Optional dependancies, depending on what clouds you want to provide access to
    # shakenfist-client               # apache2
    # ovirt-engine-sdk-python>=4.6.1  # apache2
    # keystoneauth1                   # apache2
    # openstacksdk                    # apache2
    # python-keystoneclient           # apache2

    # Indirect dependencies. We do not track license for these.
    "marshmallow==3.26.2",
    "PyJWT==2.13.0",
    "aniso8601==10.0.1",
    "annotated-types==0.7.0",
    "greenlet==3.2.0",
    "importlib-metadata==8.6.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "mako==1.3.12",
    "MarkupSafe==3.0.2",
    "mistune==3.2.1",
    "python-dotenv==1.1.0",
    "pytz==2025.2",
    "werkzeug==3.1.6",
    "zipp==3.21.0",
    "attrs==25.4.0",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "cryptography==48.0.1",
    "debtcollector==3.0.0",
    "fasteners==0.20",
    "idna==3.15",
    "importlib_metadata==8.6.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "netaddr==1.3.0",
    "oslo.concurrency==7.4.0",
    "oslo.config==10.3.0",
    "oslo.i18n==6.7.2",
    "oslo.utils==10.0.0",
    "packaging==26.0",
    "pbr==7.0.3",
    "prometheus_client==0.20.0",
    "pycparser==3.0",
    "pydantic_core==2.41.5",
    "pylogrus==0.4.0",
    "pyparsing==3.3.2",
    "referencing==0.37.0",
    "requests==2.32.5",
    "rfc3986==2.0.0",
    "rpds-py==0.30.0",
    "six==1.17.0",
    "stevedore==5.7.0",
    "typing-inspection==0.4.2",
    "typing_extensions==4.14.1",
    "urllib3==2.6.3",
    "uv==0.11.15",
    "wrapt==2.1.1",
    "blinker==1.9.0",
    # END_OF_INDIRECT_DEPS
]

[project.urls]
"Homepage" = "https://shakenfist.com"
"Bug Tracker" = "https://github.com/shakenfist/kerbside/issues"

[project.scripts]
kerbside = "kerbside.main:cli"
kerbside-util = "kerbside.utilities.main:cli"

[tool.setuptools]
packages = ["kerbside", "kerbside.rpc"]

[tool.setuptools_scm]
git_describe_command = "git describe --dirty --tags --match v* --first-parent"
write_to = "kerbside/_version.py"

[project.optional-dependencies]
test = [
    "coverage",            # apache2
    "testtools",           # mit
    "mock",                # bsd
    "stestr",              # apache2
    "tox",                 # mit
    "flake8",              # mit

    # protobuf / gRPC code generation (tox -egenprotos). Pinned to
    # match the runtime grpcio/protobuf so regeneration is deterministic.
    "grpcio-tools==1.81.1",            # apache2
    "mypy-protobuf==5.1.0",           # apache2

    "shakenfist-client>=0.7.0.0rc6",   # apache2
    #"ovirt-engine-sdk-python>=4.6.1",  # apache2
    "keystoneauth1",                   # apache2
    "openstacksdk>=4.5.0",             # apache2
]
