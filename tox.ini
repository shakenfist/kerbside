[tox]
envlist = py3,flake8,cover
isolated_build = true

[testenv]
extras =
  test
sitepackages = True
commands =
    # NOTE: you can run any command line tool here - not just tests
    stestr run {posargs}
allowlist_externals =
  bash
  find
  rm
  env
  tar
# SHAKENFIST_LOG_TO_STDOUT makes shakenfist_utilities.logs.setup()
# install a StreamHandler on stdout instead of a
# SysLogHandler('/dev/log'). Without it the unit tests' own logging
# lands in the CI runner's journal, which sfcbr ships to Loki (#646),
# and stestr cannot show it against a failing test. shakenfist's
# tox.ini sets it for the same reason. Any testenv overriding setenv
# must interpolate {[testenv]setenv} rather than replace it, or it
# loses this and the OS_* capture settings below.
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  OS_STDOUT_CAPTURE=1
  OS_STDERR_CAPTURE=1
  OS_TEST_TIMEOUT=160
  PYTHONDONTWRITEBYTECODE=1
  SHAKENFIST_LOG_TO_STDOUT=1

[testenv:flake8]
description =
  Run style checks on the changes made since HEAD~, or on the git
  ranges given as positional arguments (-RANGE a..b [c..d ...]), as
  tools/audit/wave1.sh does for the range it is auditing.
envdir = {toxworkdir}/shared
commands =
  bash tools/flake8wrap.sh {posargs:-HEAD}

[testenv:shellcheck]
description =
  Run shellcheck over the shell scripts in tools/ and demo/.
# shellcheck-py rather than a system package, pinned to the same version
# .pre-commit-config.yaml's shellcheck `rev` uses, so the hook and this
# environment cannot disagree about what passes -- keep the two in
# lockstep when either is bumped. Renovate sees this pin through a
# customManagers regex in renovate.json and groups it with the hook. sitepackages and extras are cleared: the
# [testenv] defaults would install the package and let the ambient
# environment leak in, and a lint pass needs neither.
envdir = {toxworkdir}/shellcheck
sitepackages = False
skip_install = true
extras =
deps =
  shellcheck-py==0.11.0.1
commands =
  bash tools/shellcheck-wrap.sh

[testenv:py3]
description =
  Run python3 unit tests

[testenv:cover]
description =
  Generate a coverage report in cover/.
setenv =
  {[testenv]setenv}
  PYTHON=coverage run --source kerbside --parallel-mode
commands =
  coverage erase
  stestr run {posargs}
  coverage combine
  coverage html -d cover
  coverage report

[testenv:genprotos]
description =
  Regenerate protobuf and gRPC code from kerbside/rpc/kerbside.proto.
  This uses the exact library versions from the deps below to ensure the
  generated code matches runtime expectations.
envdir = {toxworkdir}/shared
changedir = {toxinidir}
# Pinned to match the runtime grpcio / protobuf pins in pyproject.toml so
# the checked-in generated stubs regenerate deterministically.
deps =
  grpcio-tools==1.82.1
  mypy-protobuf==5.1.0
commands =
  bash tools/gen-protos.sh

[testenv:bindep]
description =
  Check for missing OS package dependencies using bindep.
skip_install = true
deps =
  bindep
commands =
  bindep test
