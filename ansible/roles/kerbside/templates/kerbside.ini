{#
  Kerbside reads this file with configparser's basic interpolation, so a lone
  % in any value is an error, and Kerbside exits 0 on one (kerbside#313). The
  settings are therefore a mapping rendered by a single loop, which doubles
  every % on the way out: no value can reach the file without it. Kerbside
  reads the result back with one level of interpolation, and its alembic
  environment doubles the SQL URL again internally, so this is the only
  doubling the role does.

  sf_console_token_audience is kerbside_url verbatim. It must equal the
  KERBSIDE_URL of every Shaken Fist cluster among the sources exactly, so it
  is never derived here. Empty, which validate allows only when no source is
  of type shakenfist, Kerbside derives its own.

  No keystone_* settings: an OpenStack source carries its own credentials in
  sources.yaml.
#}
{% set kerbside_ini_settings = {
  'sql_url': kerbside_sql_url,
  'auth_secret_seed': kerbside_auth_secret_seed,
  'sources_path': kerbside_config_dir ~ '/sources.yaml',
  'public_fqdn': kerbside_public_fqdn,
  'cacert_path': kerbside_cacert_file,
  'proxy_host_cert_path': kerbside_proxy_cert_file,
  'proxy_host_cert_key_path': kerbside_proxy_key_file,
  'proxy_host_subject': kerbside_host_subject.stdout,
  'sf_console_token_audience': kerbside_url,
  'public_secure_port': kerbside_vdi_secure_port,
  'public_insecure_port': kerbside_vdi_insecure_port,
  'vdi_secure_port': kerbside_vdi_secure_port,
  'vdi_insecure_port': kerbside_vdi_insecure_port,
  'prometheus_metrics_port': kerbside_metrics_port,
  'node_name': inventory_hostname,
} %}
# Kerbside's configuration, written by the shakenfist.kerbside kerbside
# role. Local changes are overwritten on the next deploy.
[kerbside]
{% for key, value in kerbside_ini_settings.items() %}
{{ key }} = {{ value | string | replace('%', '%%') }}
{% endfor %}
