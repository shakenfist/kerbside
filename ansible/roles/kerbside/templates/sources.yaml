{#
  kerbside_sources, dumped as data by to_nice_yaml, never assembled from
  strings, so a password which looks like a number, or carries a colon or a
  quote, is still quoted correctly, and a CA certificate loads back as exactly
  the text given. ansible's dumper writes a multi-line string as a quoted
  scalar rather than a literal block; that is uglier to read, but it loads
  back byte for byte, which is what Kerbside's ca_cert comparison needs.

  The width is large so that no value is folded across lines. Folding would
  load back correctly too, but a line per value is easier to read.
#}
# Kerbside's sources, written by the shakenfist.kerbside kerbside role.
# Local changes are overwritten on the next deploy.
{{ kerbside_sources | to_nice_yaml(indent=2, width=100000) }}
