---
# Install Kerbside on this host, and record what was installed.
#
# Nothing here assumes another role has run on this host: the build
# dependencies, the user and the virtualenv are all Kerbside's own. On a host
# which runs other services too they sit beside those services' and share
# nothing with them.
#
# The apt task is tagged packages, and the user and group tasks system-users,
# so a test without root can skip them by tag. Everything else writes only
# under kerbside_state_dir and kerbside_venv, which a test can redirect.

# mysqlclient ships no wheel and is built from source, which needs a compiler,
# the MariaDB client headers and pkg-config (Kerbside's installation guide).
# The cache is refreshed because nothing else is assumed to have refreshed it.
- name: Install Kerbside's build dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - pkg-config
      - python3-dev
      - python3-venv
      - libmariadb-dev-compat
      - libxml2-dev
      - libxslt1-dev
    state: latest
    update_cache: true
    cache_valid_time: 3600
  register: kerbside_apt_action
  retries: 100
  until: >-
    kerbside_apt_action is success or
    ('Failed to lock apt for exclusive operation' not in kerbside_apt_action.msg and
     '/var/lib/dpkg/lock' not in kerbside_apt_action.msg)
  tags: [packages]

- name: Create the Kerbside group
  ansible.builtin.group:
    name: "{{ kerbside_group }}"
    system: true
  tags: [system-users]

# Kerbside writes only its API socket directory, which systemd creates for it
# (RuntimeDirectory=kerbside), so the user needs neither a shell nor a home it
# owns. The home is the state directory, which stays root's.
- name: Create the Kerbside user
  ansible.builtin.user:
    name: "{{ kerbside_user }}"
    group: "{{ kerbside_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ kerbside_state_dir }}"
    create_home: false
  tags: [system-users]

- name: Create the Kerbside state directory
  ansible.builtin.file:
    path: "{{ kerbside_state_dir }}"
    state: directory
    owner: "{{ kerbside_file_owner }}"
    group: "{{ kerbside_file_group }}"
    mode: "0755"

# Kerbside needs nothing from apt at runtime, so the virtualenv does not see
# the system site-packages.
- name: Create the Kerbside virtualenv
  ansible.builtin.command: python3 -m venv {{ kerbside_venv | quote }}
  args:
    creates: "{{ kerbside_venv }}/bin/activate"

# kerbside_pip_extra applies here too: on a host which can reach only a
# private index, installing uv is the first thing which needs it.
- name: Upgrade pip and install uv in the Kerbside virtualenv
  # noqa: command-instead-of-shell -- shell word-splitting is required because
  # kerbside_pip_extra may be empty or expand to several arguments.
  ansible.builtin.shell: >-
    {{ (kerbside_venv ~ '/bin/pip') | quote }} install -U
    {{ kerbside_pip_extra }} pip uv
  changed_when: true

# kerbside_local_wheels, from the control node, each to a path named by its
# file name alone (kerbside_wheel_dir, vars/main.yml). Unchanged bytes are not
# copied again, and are installed from the same path, so they freeze the same
# and leave the code hash, and so Kerbside, alone.
- name: Create the directory for Kerbside's local wheels
  ansible.builtin.file:
    path: "{{ kerbside_wheel_dir }}"
    state: directory
    owner: "{{ kerbside_file_owner }}"
    group: "{{ kerbside_file_group }}"
    mode: "0755"
  when: kerbside_local_wheels | length > 0

- name: Copy Kerbside's local wheels
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ kerbside_wheel_dir }}/{{ item | basename }}"
    owner: "{{ kerbside_file_owner }}"
    group: "{{ kerbside_file_group }}"
    mode: "0644"
  loop: "{{ kerbside_local_wheels }}"

# Each package may be a requirement or a local wheel path, and a wheel in
# kerbside_local_wheels replaces the package it is named for
# (kerbside_install_package and kerbside_install_proxy_package, vars/main.yml).
# --reinstall makes a redeploy pick up a rebuilt wheel with an unchanged
# version string. An empty proxy package is left out, so the kerbside-proxy
# which the kerbside package requires is installed. gunicorn serves Kerbside's
# API. The Shaken Fist client is imported by Kerbside's Shaken Fist source
# driver but is not a dependency of the kerbside package, so it is installed
# when a source is of type shakenfist, and otherwise not.
- name: Install Kerbside, its proxy, gunicorn and any client its sources need
  # noqa: command-instead-of-shell -- shell word-splitting is required because
  # kerbside_pip_extra may be empty or expand to several arguments. Everything
  # else is quoted, so that a requirement such as kerbside>=0.7.0 is not read
  # as a redirection.
  ansible.builtin.shell: >-
    {{ (kerbside_venv ~ '/bin/uv') | quote }} pip install --reinstall
    {{ kerbside_pip_extra }}
    {{ kerbside_install_package | quote }}
    {{ kerbside_install_proxy_package | quote
    if kerbside_install_proxy_package | length > 0 else '' }}
    gunicorn
    {{ kerbside_client_package | quote
    if kerbside_shakenfist_sources | length > 0 else '' }}
  environment:
    VIRTUAL_ENV: "{{ kerbside_venv }}"
  changed_when: true

# The code half of the desired state which decides whether Kerbside restarts
# (the config entry point adds the configuration half, and register compares
# the two together with what was last deployed). The install above always
# reports changed, and a rebuilt wheel differs byte for byte even when its
# source did not, so neither says whether the code changed. The installed files
# and package versions do.
#
# What is hashed, in one stream:
#
#   * the files of the kerbside package, of the shakenfist_client package when
#     a source is of type shakenfist (so it was installed above), and the
#     kerbside-proxy binary. The kerbside-proxy wheel installs only that binary
#     and no Python package, so the binary is the whole of it. These catch a
#     rebuilt wheel whose version did not change. __pycache__ is left out
#     because .pyc files embed timestamps.
#   * the virtualenv's resolved package set, from uv pip freeze, sorted here
#     rather than trusting uv's order. A dependency-only upgrade (sqlalchemy,
#     gunicorn, ...) changes no file above, but --reinstall has still rewritten
#     files under the running processes, so any version change must restart
#     Kerbside. pip and uv are left out: the task above upgrades them on every
#     deploy, Kerbside never imports them, and uv releases often enough that
#     including them would restart Kerbside, dropping its consoles, after most
#     uv releases. A package installed from a wheel path freezes as
#     "name @ file:///path", so a wheel at a new path also restarts it.
#
# The freeze is piped straight into the hash, never registered: a package
# installed from a URL with a credential in it freezes with that URL. This is
# a value, not a changed flag: nothing is written here, so a deploy which
# fails later leaves nothing behind to say the new code was deployed.
#
# The site-packages directory is asked of the virtualenv's own Python, since
# its version depends on the distribution.
- name: Find the Kerbside virtualenv's site-packages
  ansible.builtin.command: >-
    {{ kerbside_venv }}/bin/python -c
    'import sysconfig; print(sysconfig.get_path("purelib"))'
  register: kerbside_site_packages
  changed_when: false

# find -H follows the binary should it be installed as a symlink. errexit and
# pipefail fail the task when a package is missing (find fails) or uv pip
# freeze fails, rather than hashing whatever half of the stream was produced.
# VIRTUAL_ENV selects the virtualenv for uv, as for the install above.
- name: Compute the installed Kerbside code signature
  ansible.builtin.shell:
    cmd: >-
      set -o errexit -o pipefail;
      {
      find -H
      {{ (kerbside_site_packages.stdout ~ '/kerbside') | quote }}
      {{ (kerbside_site_packages.stdout ~ '/shakenfist_client') | quote
      if kerbside_shakenfist_sources | length > 0 else '' }}
      {{ (kerbside_venv ~ '/bin/kerbside-proxy') | quote }}
      -type f -not -path '*__pycache__*' -print0
      | sort -z | xargs -0 sha256sum;
      {{ (kerbside_venv ~ '/bin/uv') | quote }} pip freeze
      | sed -E '/^(pip|uv)(==| @ )/d' | sort;
      } | sha256sum | awk '{print $1}'
    executable: /bin/bash
  environment:
    LC_ALL: C
    VIRTUAL_ENV: "{{ kerbside_venv }}"
  register: kerbside_code_signature
  changed_when: false

- name: Remember the installed Kerbside code signature
  ansible.builtin.set_fact:
    kerbside_code_hash: "{{ kerbside_code_signature.stdout }}"
