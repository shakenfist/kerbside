---
# Refuse a Kerbside configuration which cannot work, before any host is
# changed. The consuming playbook runs this on every Kerbside host, with
# kerbside_hosts set to every Kerbside host this run deploys to. Each host is
# checked with its own variables, rather than the control node's or one host's
# for all, since operators commonly keep the Kerbside settings in the Kerbside
# hosts' group variables, which the control node cannot see, and may override
# them per host, which no other host sees. Nothing here changes any host, and
# nothing here assumes it runs on one host only. The messages name the host
# whose variables failed, since one host's may be fine and another's not.
#
# An empty kerbside_hosts means Kerbside is not being deployed, and nothing
# here applies.
#
# kerbside_sources, kerbside_auth_secret_seed and kerbside_sql_url are secrets.
# no_log on an assert would hide its message too, leaving an operator with
# nothing to act on, so these asserts instead only ever print their own fixed
# messages and the text of their conditions, neither of which contains a
# secret. The required-variable check loops over variable names and looks each
# value up, rather than looping over the values, so that no secret is ever a
# loop item either. kerbside_sources is checked by the same helper script
# which checks sources.yaml before config writes it, run on the control node
# under no_log, and only its reasons, which name positions and keys and never
# a value, are printed.

- name: Say that Kerbside is not being deployed
  ansible.builtin.debug:
    msg: >-
      kerbside_hosts is empty, so Kerbside is not being deployed and there is
      nothing to validate.
  when: kerbside_hosts | length == 0

- name: Validate the Kerbside configuration
  when: kerbside_hosts | length > 0
  block:
    - name: Refuse an empty required Kerbside variable
      ansible.builtin.assert:
        that: lookup('ansible.builtin.vars', item) | string | length > 0
        fail_msg: >-
          {{ item }} is empty on {{ inventory_hostname }}, but kerbside_hosts
          is not. Set it, or deploy Kerbside to no host.
        quiet: true
      loop:
        - kerbside_public_fqdn
        - kerbside_sql_url
        - kerbside_auth_secret_seed

    - name: Refuse an empty kerbside_sources
      ansible.builtin.assert:
        that: >-
          kerbside_sources is sequence and kerbside_sources is not string
          and kerbside_sources is not mapping and kerbside_sources | length > 0
        fail_msg: >-
          kerbside_sources on {{ inventory_hostname }} is empty, or not a
          list, but kerbside_hosts is not. List the console sources Kerbside
          serves, at least one.
        quiet: true

    # kerbside_sources as JSON, which keeps the types Ansible parsed the
    # operator's variables into: an unquoted password of 012345 is already
    # the number 5349, which the rendered sources.yaml would carry as text
    # Kerbside then reads. JSON lets the checker refuse it, where a check of
    # the rendering could not. config checks the rendering itself before
    # writing it. The value is passed on stdin, so the secrets are on no
    # command line and left in no file. The check needs no privilege on the
    # control node, whatever the play becomes on the host.
    - name: Check kerbside_sources by Kerbside's rules
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/files/kerbside-check-sources.py"
          - "--json"
          - "-"
        stdin: "{{ kerbside_sources | to_json }}"
      register: kerbside_sources_check
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Refuse a kerbside_sources Kerbside could not use
      ansible.builtin.assert:
        that: kerbside_sources_check.rc | default(1) == 0
        fail_msg: >-
          kerbside_sources on {{ inventory_hostname }} cannot be used by
          Kerbside. Sources are counted from 0 in the order kerbside_sources
          lists them. {{ kerbside_sources_check.stderr | default('') | trim
          | default('The check printed no reason.', true) }}
        quiet: true

    # kerbside_extra_settings is written into kerbside.ini after the settings
    # the role writes from its own variables, so a name in both would be
    # written twice and configparser would silently keep the last. A name
    # Kerbside has no setting for is refused on the host instead, by the
    # check the render is held to: which settings exist is Kerbside's to say,
    # and the control node may not have Kerbside installed (#629).
    - name: Refuse an extra setting the role writes itself
      ansible.builtin.assert:
        that: kerbside_extra_settings_owned | length == 0
        fail_msg: >-
          kerbside_extra_settings on {{ inventory_hostname }} sets
          {{ kerbside_extra_settings_owned | join(', ') }}, which the role
          writes into kerbside.ini itself. Set {{ 'those' if
          kerbside_extra_settings_owned | length > 1 else 'it' }} through the
          role's own variables, listed in ansible/README.md, so that the rest
          of the role sees the same value: the ports it opens, the certificate
          it renders a subject from, and the audience it requires on a Shaken
          Fist console token are all read from those variables too.
        quiet: true
      vars:
        kerbside_extra_settings_owned: >-
          {{ kerbside_extra_settings | select('in', kerbside_owned_ini_settings)
             | sort | list }}

    - name: Refuse an extra setting with no value
      ansible.builtin.assert:
        that: kerbside_extra_settings_null | length == 0
        fail_msg: >-
          kerbside_extra_settings on {{ inventory_hostname }} sets
          {{ kerbside_extra_settings_null | join(', ') }} to nothing at all.
          An undefined variable renders as the text None, which Kerbside
          would read as the value of that setting, so this is refused rather
          than written: it is almost always a vault variable or a lookup
          which did not resolve. An empty string is allowed, for the
          settings whose default is one.
        quiet: true
      vars:
        kerbside_extra_settings_null: >-
          {{ kerbside_extra_settings | dict2items
             | selectattr('value', 'none') | map(attribute='key')
             | map('string') | sort | list }}

    # Each value is written as the text of one INI line, so it has to be
    # something with one line of text to write, for the same reason as
    # null above. A list or a mapping renders as its Python repr --
    # firewall_permitted_channels: [main, display] would be written as
    # ['main', 'display'], which a text setting accepts and the firewall
    # then cannot parse -- and a line break ends the setting and starts
    # another, or continues it, in a file configparser reads. The check
    # on the host cannot see either: the name is real and the rendering
    # is a well-formed INI file. A vault-encrypted value is text; ansible
    # older than 2.19 types an inline !vault value as neither a string nor
    # a number, so it is accepted by name, and the line break test reads
    # every value as it renders rather than only the ones typed as strings.
    - name: Refuse an extra setting whose value is not one line of text
      ansible.builtin.assert:
        that:
          - kerbside_extra_settings_not_scalar | length == 0
          - kerbside_extra_settings_multiline | length == 0
        fail_msg: >-
          kerbside_extra_settings on {{ inventory_hostname }} sets
          {{ kerbside_extra_settings_not_one_line | join(', ') }}
          to something other than one line of text, a number or a boolean: a
          list or a mapping, which would be written into kerbside.ini as its
          Python repr, or text with a line break in it, which would be
          written as more than one INI line. Write the value as Kerbside's
          configuration reference spells it, as a single line.
        quiet: true
      vars:
        kerbside_extra_settings_not_scalar: >-
          {{ kerbside_extra_settings | dict2items
             | rejectattr('value', 'none') | rejectattr('value', 'string')
             | rejectattr('value', 'number') | rejectattr('value', 'boolean')
             | rejectattr('value', 'vault_encrypted')
             | map(attribute='key') | map('string') | sort | list }}
        kerbside_extra_settings_multiline: >-
          {{ kerbside_extra_settings | dict2items | map(attribute='key')
             | zip(kerbside_extra_settings | dict2items
                   | map(attribute='value') | map('string'))
             | selectattr('1', 'search', '[\r\n]') | map('first')
             | map('string') | sort | list }}
        kerbside_extra_settings_not_one_line: >-
          {{ kerbside_extra_settings_not_scalar
             | union(kerbside_extra_settings_multiline) | sort | list }}

    # The keys are read as text, since YAML makes 80 a number and an
    # unquoted on or true a boolean, and matching either would fail with a
    # Jinja error rather than this message.
    - name: Refuse an extra setting which is not an INI key
      ansible.builtin.assert:
        that: kerbside_extra_settings_malformed | length == 0
        fail_msg: >-
          kerbside_extra_settings on {{ inventory_hostname }} has the
          name(s) {{ kerbside_extra_settings_malformed | join(', ') }}, which
          are not Kerbside INI keys. A key is lower case, starts with a
          letter, and holds only letters, digits and underscores: Kerbside
          maps it to an environment variable by upper-casing it, so an upper
          case name here is the same setting written twice, and configparser
          would keep one of them.
        quiet: true
      vars:
        kerbside_extra_settings_malformed: >-
          {{ kerbside_extra_settings | map('string')
             | reject('match', '^[a-z][a-z0-9_]*$') | sort | list }}

    # bootstrap installs the client libraries the configured source types
    # need by looking each type up in these two mappings, so a type missing
    # from either would fail the lookup in the middle of a deploy, with a
    # Jinja error naming neither the type nor what to do about it. Said here
    # instead, on the control node, before any host is touched. A type which
    # needs no client library is an empty list, which is a decision; absence
    # is not (#602).
    - name: Refuse a source type the role has no client libraries for
      ansible.builtin.assert:
        that:
          - kerbside_source_types | difference(
              kerbside_source_client_packages.keys() | list) | length == 0
          - kerbside_source_types | difference(
              kerbside_source_build_packages.keys() | list) | length == 0
        fail_msg: >-
          kerbside_sources on {{ inventory_hostname }} has sources of
          type(s) {{ kerbside_source_types_unlisted | join(', ') }}, which
          kerbside_source_client_packages or kerbside_source_build_packages
          does not list. Kerbside supports the type, so this is the role
          catching up with it: add the client libraries that type's driver
          imports, or an empty list where it imports none.
        quiet: true
      vars:
        kerbside_source_types_unlisted: >-
          {{ kerbside_source_types | difference(
               kerbside_source_client_packages.keys() | list)
             | union(kerbside_source_types | difference(
               kerbside_source_build_packages.keys() | list))
             | sort | list }}

    # bootstrap reads package and directory off every entry with
    # map(attribute=...), so an entry missing either -- or a type mapped to
    # something other than a list of them -- fails there, mid-deploy, with
    # the same unhelpful Jinja error the check above exists to avoid.
    # kerbside_login_client_packages is a list, so argument_specs holds its
    # entries to this shape already; a mapping keyed by type cannot be
    # described there, so these are checked here, for the configured types.
    # A non-empty string or mapping fails the count, since none of what it
    # iterates is a mapping; the other conditions are for what the count
    # cannot see, since each iterates nothing: a value which is not iterable
    # at all, the empty string, and {}.
    - name: Refuse a client library entry without a package and a directory
      ansible.builtin.assert:
        that:
          - kerbside_client_entries is sequence
          - kerbside_client_entries is not string
          - kerbside_client_entries is not mapping
          - >-
            kerbside_client_entries | select('mapping')
            | selectattr('package', 'defined') | selectattr('package', 'string')
            | selectattr('directory', 'defined') | selectattr('directory', 'string')
            | list | length == kerbside_client_entries | length
        fail_msg: >-
          kerbside_source_client_packages on {{ inventory_hostname }} maps
          the source type {{ item }}, which kerbside_sources uses, to
          something other than a list of mappings each with a package (a
          requirement or a wheel path) and a directory (the top-level
          package it installs under site-packages, which bootstrap hashes to
          prove it landed). Use an empty list for a type which needs no
          client library.
        quiet: true
      loop: >-
        {{ kerbside_source_types
           | intersect(kerbside_source_client_packages.keys() | list) }}
      vars:
        kerbside_client_entries: "{{ kerbside_source_client_packages[item] }}"

    # kerbside_client_package was the role's only client library variable
    # until the libraries became per source type. Ansible does not refuse a
    # variable nothing declares, so a deployment which pinned or redirected
    # the Shaken Fist client with it would now get the default from PyPI and
    # never be told: the deploy not doing what was asked, and not saying so.
    - name: Refuse kerbside_client_package, which the role no longer reads
      ansible.builtin.assert:
        that: kerbside_client_package is not defined
        fail_msg: >-
          kerbside_client_package is set on {{ inventory_hostname }}, but the
          role no longer reads it, so the Shaken Fist client it names would
          not be the one installed. Move it into
          kerbside_source_client_packages, as the package of the shakenfist
          entry (whose directory is shakenfist_client), and remove it. That
          variable replaces the whole default mapping, so copy the other
          source types your kerbside_sources uses from the role's defaults
          along with it.
        quiet: true

    # A Shaken Fist cluster mints console tokens for the Kerbside at its
    # KERBSIDE_URL, and config renders kerbside_url as the audience Kerbside
    # accepts. Without a Shaken Fist source Kerbside verifies no such token,
    # and an empty kerbside_url leaves Kerbside's own default audience.
    - name: Refuse an empty kerbside_url when a source is of type shakenfist
      ansible.builtin.assert:
        that: kerbside_url | length > 0 or kerbside_shakenfist_sources | length == 0
        fail_msg: >-
          kerbside_url is empty on {{ inventory_hostname }}, but
          kerbside_sources has a source of type shakenfist
          ({{ kerbside_shakenfist_sources | join(', ') }}). Set it to the URL
          the Shaken Fist cluster renders as its KERBSIDE_URL: it is the
          audience of every console token that cluster mints.
        quiet: true

    # Kerbside ships this sentinel as the seed's default (kerbside#131), and a
    # seed which is public signs tokens anyone can forge.
    - name: Refuse Kerbside's unconfigured auth secret seed
      ansible.builtin.assert:
        that: kerbside_auth_secret_seed != '~~unconfigured~~'
        fail_msg: >-
          kerbside_auth_secret_seed on {{ inventory_hostname }} is Kerbside's
          placeholder value ~~unconfigured~~. Generate a random value of at
          least 32 characters.
        quiet: true

    - name: Refuse a short Kerbside auth secret seed
      ansible.builtin.assert:
        that: kerbside_auth_secret_seed | length >= 32
        fail_msg: >-
          kerbside_auth_secret_seed on {{ inventory_hostname }} is shorter than
          32 characters. Generate a longer random value.
        quiet: true

    # Ports are not secrets, so the messages name the values.
    - name: Validate the Kerbside ports
      vars:
        kerbside_ports:
          kerbside_api_port: "{{ kerbside_api_port }}"
          kerbside_vdi_secure_port: "{{ kerbside_vdi_secure_port }}"
          kerbside_vdi_insecure_port: "{{ kerbside_vdi_insecure_port }}"
          kerbside_metrics_port: "{{ kerbside_metrics_port }}"
      block:
        - name: Refuse a malformed kerbside_reserved_ports entry
          ansible.builtin.assert:
            that:
              - kerbside_reserved_ends | length == 2
              - >-
                kerbside_reserved_ends | map('string')
                | select('match', '^[0-9]+$') | list | length == 2
              - kerbside_reserved_ends[0] | int >= 1
              - kerbside_reserved_ends[0] | int <= kerbside_reserved_ends[1] | int
              - kerbside_reserved_ends[1] | int <= 65535
            fail_msg: >-
              kerbside_reserved_ports entry {{ kerbside_reserved_index }} on
              {{ inventory_hostname }} is {{ item | to_json }}, but each entry
              must be a port from 1 to 65535, or a [low, high] range of them
              whose low is no higher than its high.
            quiet: true
          loop: "{{ kerbside_reserved_ports }}"
          loop_control:
            index_var: kerbside_reserved_index
            label: "{{ kerbside_reserved_index }}"
          vars:
            kerbside_reserved_ends: >-
              {{ [item, item] if item is integer or item is string
                 else (item if item is iterable and item is not mapping
                       else []) }}

        # Each port is compared with every entry, a single port being a range
        # of one. kerbside_port_reserved_by is the entries which reserve it,
        # as text, and empty when none does.
        - name: Refuse a Kerbside port in kerbside_reserved_ports
          ansible.builtin.assert:
            that: kerbside_port_reserved_by | string | length == 0
            fail_msg: >-
              {{ item.key }} is {{ item.value }} on {{ inventory_hostname }},
              but kerbside_reserved_ports reserves
              {{ kerbside_port_reserved_by }} there, for something else on
              that host. Choose another port.
            quiet: true
          loop: "{{ kerbside_ports | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          vars:
            kerbside_port_reserved_by: >-
              {%- set ns = namespace(hits=[]) -%}
              {%- for entry in kerbside_reserved_ports -%}
              {%- set ends = [entry, entry] if entry is integer
                             or entry is string else entry -%}
              {%- set low = ends[0] | int -%}
              {%- set high = ends[1] | int -%}
              {%- if low <= item.value | int and item.value | int <= high -%}
              {%- set ns.hits = ns.hits
                  + [(low | string) if low == high else (low ~ '-' ~ high)] -%}
              {%- endif -%}
              {%- endfor -%}
              {{ ns.hits | join(', ') }}

        - name: Refuse two Kerbside listeners on the same port
          ansible.builtin.assert:
            that: >-
              kerbside_ports.values() | map('int') | unique | list | length
              == kerbside_ports | length
            fail_msg: >-
              Two Kerbside ports on {{ inventory_hostname }} are equal, but each
              needs a port of its own:
              {% for name, port in kerbside_ports.items() %}{{ name }}={{ port
              }}{{ ', ' if not loop.last else '.' }}{% endfor %}
            quiet: true

    # Paths are not secrets, so the message names which are set.
    - name: Refuse a partial set of Kerbside certificate overrides
      ansible.builtin.assert:
        that: kerbside_overrides_set | length in [0, kerbside_overrides | length]
        fail_msg: >-
          Only some of the Kerbside certificate override paths are set on
          {{ inventory_hostname }} ({{ kerbside_overrides_set | join(', ') }}), and
          {{ kerbside_overrides | dict2items | selectattr('value', 'equalto', '')
          | map(attribute='key') | join(', ') }} {{ 'is' if
          kerbside_overrides_set | length == 2 else 'are' }} empty. Set all
          three to use your own certificate, or none of them to use the one
          installed under kerbside_pki_dir.
        quiet: true
      vars:
        kerbside_overrides:
          kerbside_proxy_cert_path: "{{ kerbside_proxy_cert_path }}"
          kerbside_proxy_key_path: "{{ kerbside_proxy_key_path }}"
          kerbside_cacert_path: "{{ kerbside_cacert_path }}"
        kerbside_overrides_set: >-
          {{ kerbside_overrides | dict2items
             | rejectattr('value', 'equalto', '') | map(attribute='key') | list }}

    # Each local wheel replaces one package spec, chosen by the wheel's file
    # name, so a name which matches neither, or two wheels for one package,
    # would be installed beside the package or leave one of the two unused.
    # bootstrap copies them from the control node, where they are looked for
    # here. Paths are not secrets, so the messages name them.
    - name: Refuse a local wheel which replaces no Kerbside package
      ansible.builtin.assert:
        that: >-
          item | basename is match(kerbside_wheel_pattern)
          or item | basename is match(kerbside_proxy_wheel_pattern)
        fail_msg: >-
          kerbside_local_wheels on {{ inventory_hostname }} lists {{ item }},
          which is neither a kerbside wheel (kerbside-*.whl) nor a
          kerbside_proxy wheel (kerbside_proxy-*.whl). Only those two replace
          a package; install anything else with kerbside_pip_extra.
        quiet: true
      loop: "{{ kerbside_local_wheels }}"

    - name: Refuse two local wheels for one Kerbside package
      ansible.builtin.assert:
        that: >-
          kerbside_local_wheel_names | select('match', item) | list | length <= 1
        fail_msg: >-
          kerbside_local_wheels on {{ inventory_hostname }} lists more than
          one {{ 'kerbside_proxy' if item == kerbside_proxy_wheel_pattern
          else 'kerbside' }} wheel
          ({{ kerbside_local_wheel_names | select('match', item) | join(', ') }}),
          but each replaces the one package spec. List one.
        quiet: true
      loop:
        - "{{ kerbside_wheel_pattern }}"
        - "{{ kerbside_proxy_wheel_pattern }}"

    - name: Refuse a local wheel which is not on the control node
      ansible.builtin.assert:
        that: item is file
        fail_msg: >-
          kerbside_local_wheels on {{ inventory_hostname }} lists {{ item }},
          which is not a file on the control node, where bootstrap copies it
          from.
        quiet: true
      loop: "{{ kerbside_local_wheels }}"
