---
# Defaults for the kerbside role. Every variable is documented in
# meta/argument_specs.yml. The consuming playbook maps its inventory onto
# these; the role reads no inventory group names and no other host's facts.
#
# The values a deployment must supply default to empty, and the validate
# entry point refuses to deploy while any of them is empty and kerbside_hosts
# is not. The secrets (kerbside_sources, which carries every source's
# credentials, kerbside_auth_secret_seed and kerbside_sql_url) have no usable
# default on purpose.

# Required when deploying. kerbside_url is required only when a source is of
# type shakenfist, since it is the audience of that source's console tokens.
kerbside_url: ""
kerbside_public_fqdn: ""
kerbside_auth_secret_seed: ""
kerbside_sql_url: ""
kerbside_sources: []

# Settings written into kerbside.ini after the ones the role writes from its
# own variables (kerbside_owned_ini_settings, vars/main.yml), as a mapping of
# INI key to value: a Keystone login, firewall_mode, log_verbose, the token
# durations, or anything else in Kerbside's configuration reference. Without
# them a role-deployed Kerbside could be given nothing but those the role
# knows about (#629).
#
# A name the role writes itself, or a value which would not render as one INI
# line (null, a list, a mapping, or text with a line break), is refused by
# validate, and a name Kerbside has no setting for is refused on the host,
# before the render replaces the file Kerbside is running with. The values are
# no_log, since a login carries a service password, and kerbside.ini is 0640
# root:kerbside either way.
kerbside_extra_settings: {}

# The client libraries interactive login imports, installed when
# kerbside_extra_settings configures one. Kerbside's Keystone login is not a
# property of the sources, so it is not in kerbside_source_client_packages;
# the shape is the same (see there).
kerbside_login_client_packages:
  - package: "keystoneauth1"
    directory: keystoneauth1
  - package: "python-keystoneclient"
    directory: keystoneclient

# The Kerbside hosts this run validates or deploys to.
kerbside_hosts: []

# Packages. kerbside_package floors on the first release which never returns
# a source's password from the API (see argument_specs). An empty
# kerbside_proxy_package means the version kerbside_package pins. A wheel in
# kerbside_local_wheels replaces kerbside_package or kerbside_proxy_package,
# by its name.
kerbside_package: "kerbside>=0.7.0"
kerbside_proxy_package: ""
kerbside_local_wheels: []
kerbside_pip_extra: ""

# The client libraries each source type's driver imports, keyed by type.
# Kerbside imports every cloud client lazily and depends on none of them
# (pyproject.toml), so a client which is not installed surfaces as a source
# marked errored and ignored, or a 500 from token exchange -- never as a
# failed deploy. bootstrap therefore installs exactly the clients the
# configured source types need, and hashes each one's directory, which fails
# the deploy if a client did not land (#602).
#
# package is a requirement or a local wheel path, and directory is the
# top-level package it installs under site-packages, which is what the driver
# imports. test_ansible_role.py holds the directories to every client Kerbside
# imports lazily, so a new one cannot ship without being installed here, and
# holds the requirements to the table in docs/installation.md.
kerbside_source_client_packages:
  shakenfist:
    - package: "shakenfist-client>=0.8.3"
      directory: shakenfist_client
  ovirt:
    - package: "ovirt-engine-sdk-python>=4.6.1"
      directory: ovirtsdk4
  openstack:
    - package: "openstacksdk"
      directory: openstack
    - package: "keystoneauth1"
      directory: keystoneauth1
    - package: "python-keystoneclient"
      directory: keystoneclient
  proxmox: []
  static: []

# The apt packages a source type's client libraries need to build, keyed by
# type, added to Kerbside's own build dependencies when such a source is
# configured. ovirt-engine-sdk-python is a C extension over libcurl
# (docs/installation.md). An empty list is a type whose clients need nothing
# beyond Kerbside's own, or which has no client at all.
kerbside_source_build_packages:
  shakenfist: []
  ovirt:
    - libcurl4-openssl-dev
    - libssl-dev
  openstack: []
  proxmox: []
  static: []

# Listeners. No two ports may be equal, and none may be in
# kerbside_reserved_ports: ports, or [low, high] ranges, which something else
# on this host uses.
kerbside_api_address: "0.0.0.0"
kerbside_api_port: 13002
kerbside_api_workers: 2
kerbside_vdi_secure_port: 5900
kerbside_vdi_insecure_port: 5901
kerbside_metrics_port: 13003
kerbside_reserved_ports: []

# How many times, three seconds apart, register checks for a signing key fetch
# by every Shaken Fist source made during this deploy. The default allows
# three of Kerbside's 60 second scrape passes.
kerbside_ready_retries: 60

# Operator-supplied proxy certificate. All three empty, the default, means the
# consuming playbook puts one under kerbside_pki_dir, for example from Shaken
# Fist's internal_ca role. All three set means these paths on the Kerbside
# host are used as they are.
kerbside_proxy_cert_path: ""
kerbside_proxy_key_path: ""
kerbside_cacert_path: ""

# Where the consuming playbook installs the proxy certificate, key and CA when
# the overrides above are empty, and their file names there. Under
# kerbside_config_dir, so a test without root redirects both together. The
# names are those Shaken Fist's internal_ca role installs by default
# (cert_dest_cert_name, cert_dest_key_name and cert_dest_ca_name).
kerbside_pki_dir: "{{ kerbside_config_dir }}/pki"
kerbside_proxy_cert_name: "server-cert.pem"
kerbside_proxy_key_name: "server-key.pem"
kerbside_proxy_cacert_name: "ca-cert.pem"

# Paths and owners. The production values; they are variables only so that a
# test without root can point them somewhere it may write.
kerbside_config_dir: "/etc/kerbside"
kerbside_state_dir: "/srv/kerbside"
kerbside_venv: "/srv/kerbside/venv"
kerbside_unit_dir: "/etc/systemd/system"
kerbside_user: "kerbside"
kerbside_group: "kerbside"
kerbside_file_owner: "root"
kerbside_file_group: "root"
